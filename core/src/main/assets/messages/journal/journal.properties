journal.document.adventurers_guide.title=Tome of Dungeon Mastery
journal.document.adventurers_guide.intro.title=Introduction
journal.document.adventurers_guide.intro.body=Greetings Adventurer, you are reading the Tome of Dungeon Mastery! This guidebook is best used as a reference, and will magically let you know when it's best to read each page.\n\n(When the journal button flashes, select it to read what the guidebook has to tell you! Some pages are missing though, perhaps you can find them in the dungeon?)
journal.document.adventurers_guide.examining.title=Examining
journal.document.adventurers_guide.examining.body=It's important to study your enemies and surroundings instead of rushing in blindly! Get in the habit of examining everything new.\n\n(You can examine by using the magnifying glass button and then selecting what you want to examine. You can also examine buffs or debuffs by selecting their icons.)
journal.document.adventurers_guide.surprise_attacks.title=Surprise Attacks
journal.document.adventurers_guide.surprise_attacks.body=Surprise attacks are guaranteed to hit, making them especially useful against evasive enemies like snakes and wraiths.\n\nYou can surprise enemies right after they enter a doorway while chasing you, or when they otherwise lose sight of you.
journal.document.adventurers_guide.identifying.title=Identifying Items
journal.document.adventurers_guide.identifying.body=The colors of potions and symbols on scrolls are different in each dungeon. Unidentified equipment can be upgraded or enchanted if you're lucky, or it might be cursed!\n\nScrolls of identify, upgrade, or remove curse are very useful if you want to reduce the risk of using unidentified equipment.\n\n(You can find a list of all the items you've identified in the catalog tab of your journal)
journal.document.adventurers_guide.food.title=Dealing with Hunger
journal.document.adventurers_guide.food.body=Rationing effectively is one of the best ways to improve your odds of survival, you don't always need to eat right when you get hungry!\n\nWhen you aren't starving you will slowly regenerate health, so if you eat at full health that regeneration will be wasted!\n\nIf you pace out when you eat based on your health, your food will last much longer.
journal.document.adventurers_guide.alchemy.title=Alchemy & Trinkets
journal.document.adventurers_guide.alchemy.body=If you don't find a consumable item useful, you can use it as an alchemy ingredient or turn it into all-purpose alchemical energy. Energizing potions and scrolls also identifies them!\n\nTrinkets are a unique kind of equipment that are created and upgraded using alchemy. They're made with a magical trinket catalyst and a bit of alchemical energy.\n\n(The first alchemy pot is on the 3rd or 4th floor of the dungeon. There are alchemy recipe book pages near these pots as well.)
journal.document.adventurers_guide.dieing.title=Handling Defeat
journal.document.adventurers_guide.dieing.body=Dungeoneering is dangerous and most adventurers eventually meet their demise.\n\nLuck helps, but the best adventurers use every little trick to improve their chances.\n\n(Don't be upset if you are dying a lot, this game is hard! Focus on learning the game and steadily improving, not on winning right away.)
journal.document.adventurers_guide.searching.title=Searching
journal.document.adventurers_guide.searching.body=Dungeons are full of secret doors and traps that appear invisible at first glance. Hold the magnifying glass button to spend a turn searching nearby tiles.\n\nPress it once to inspect a tile, or twice to keep Examine active while inspecting several tiles or inventory items. Press it again, or Escape/Back from the dungeon, to exit. Examining is free, but does not reveal hidden traps. Maybe there are some hidden doors near where you found this page!
journal.document.adventurers_guide.strength.title=Strength
journal.document.adventurers_guide.strength.body=There isn't time to train with weapons and armor you find in the dungeon, so you'll need brute strength to use them effectively.\n\nPotions of strength and scrolls of upgrade are the most effective way to meet the strength requirements of higher tier gear.\n\nIt's important to eventually start using high tier items, but don't ignore equipment you can use right now.
journal.document.adventurers_guide.upgrades.title=Upgrades
journal.document.adventurers_guide.upgrades.body=The deeper you go into a dungeon, the more important it is that you're using magically upgraded high tier gear, but you'll also need the strength to use them properly.\n\nWands, rings, and artifacts don't need strength, but have limited usages or don't help as directly in combat.\n\nMaking good choices about what you upgrade is very important for surviving early in the dungeon, and for setting yourself up for success later in the dungeon.
journal.document.adventurers_guide.looting.title=Effective Looting
journal.document.adventurers_guide.looting.body=Rooms that are behind locked doors or that contain obstacles usually have better loot. When an obstacle blocks your path, you can usually find an item to help on the same floor.\n\nYou will always be able to find 2 potions of strength and 3 scrolls of upgrade in each five floor dungeon region, so they're a great indicator of how well you're exploring.\n\n(You can see a list of landmarks and unused keys in the notes tab of the journal window.)
journal.document.adventurers_guide.levelling.title=Gaining Experience
journal.document.adventurers_guide.levelling.body=Levelling up boosts your stats and awards talent points, which can make a big difference in combat. It's best to have at least one level for each floor of the dungeon.\n\nIt can be tempting to rush and avoiding exploration or combat, but doing so will deprive you of supplies and experience.\n\n(You can see information about your hero, including exp, on the status pane at the corner of the game interface. Select your hero portrait to get even more info.)
journal.document.adventurers_guide.positioning.title=Positioning
journal.document.adventurers_guide.positioning.body=Strategy is just as important as equipment. Bad situations like getting surrounded can usually be avoided with good positioning.\n\nFor instance, most dungeons have thin corridors which force enemies to fight you one at a time. These corridors often have doorways for surprise attacks too!\n\nThere are lots of little ways to use environment features like grass, water, pits, or traps to your advantage as well.
journal.document.adventurers_guide.magic.title=Magical Attacks
journal.document.adventurers_guide.magic.body=Magical attacks cut right through armor and are difficult to dodge. This means that damage from wands is very reliable, but also makes magical enemies very dangerous!\n\nMagical attacks always have a drawback though. Wands have limited charges and magical enemies usually won't be able to use their magic in close range.\n\nWhen facing enemies that use magic it is important to learn how to prevent them from using it on you.

journal.document.alchemy_guide.title=Alchemy Guide
journal.document.alchemy_guide.potions.title=Intro and Potions
journal.document.alchemy_guide.potions.body=Welcome to Practical Applications of Alchemy! This book is a reference of recipes to craft items at an alchemy pot.\n\nWe'll start with the most iconic recipe: Potions!\n\nUse three seeds to brew a random potion! Every seed has a potion counterpart, use multiple of the same seed to increase the chance that the potion relates to the seeds you used.
journal.document.alchemy_guide.stones.title=Creating Runestones
journal.document.alchemy_guide.stones.body=Mixing a scroll into an alchemy pot will imbue its magic into two rocks within the pot. This creates runestones and identifies the scroll!
journal.document.alchemy_guide.energy_food.title=Energy and Food
journal.document.alchemy_guide.energy_food.body=Many recipes require crystal alchemical energy, which is made by deconstructing consumable items in an alchemy pot. Energizing potions or scrolls also identifies them.\n\nSome recipes that require energy are magical, but these ones resemble traditional cooking.
journal.document.alchemy_guide.exotic_potions.title=Exotic Potions
journal.document.alchemy_guide.exotic_potions.body=Potions can be mixed with energy to create exotic potions. They have more powerful effects, but are often useful in different ways.
journal.document.alchemy_guide.exotic_scrolls.title=Exotic Scrolls
journal.document.alchemy_guide.exotic_scrolls.body=Exotic scrolls can be made with some energy and a scroll. They're a bit stronger and more expensive than exotic potions.
journal.document.alchemy_guide.bombs.title=Enhanced Bombs
journal.document.alchemy_guide.bombs.body=A standard black powder bomb can be mixed with a specific item to create an enhanced bomb.
journal.document.alchemy_guide.weapons.title=Enhancing Weapons
journal.document.alchemy_guide.weapons.body=Some of the lighter or more magical weapons can be used in alchemy!\n\nEach thrown weapon set produces enough liquid metal to fully repair another set of the same level and tier. Note that alchemizing a set will destroy the whole set, even if it isn't all present!\n\nOne wand will produce enough arcane resin to upgrade two wands of the same level, but no higher than +3.
journal.document.alchemy_guide.brews_elixirs.title=Brews and Elixirs
journal.document.alchemy_guide.brews_elixirs.body=Brews and elixirs are advanced potions with a variety of effects, usually with a single use.
journal.document.alchemy_guide.spells.title=Spells
journal.document.alchemy_guide.spells.body=Spells are contained in crystals and provide a variety of effects, usually with multiple uses.

journal.document.intros.title=Region Introductions
journal.document.intros.discover_hint=You can find this text when entering a specific region for the first time.
journal.document.intros.dungeon.title=Dungeon
journal.document.intros.dungeon.body=Grimhollow's last bell rings without a hand upon the rope. Beneath the streets, something answers. Wells have turned bitter; the missing return only in other people's dreams.\n\nThe city's oldest records name an amulet sealed below the dwarven halls. You have brought what little the surface could spare. Whatever waits beneath it, the road home begins by going down.
journal.document.intros.sewers.title=Sewers
journal.document.intros.sewers.body=These channels once carried rain away from Grimhollow. Now the gates stand shut, and the water scarcely moves. Someone has been tending the lamps long after the last maintenance crew vanished.\n\nThe rats are bold enough to follow your light. Further in, old prison keys hang from a nail above the flood line. The city sealed its troubles underground; it never stopped to count them.
journal.document.intros.prison.title=Prison
journal.document.intros.prison.body=The stair ends at the prison's service gate. Names have been scratched from the duty board, leaving pale grooves beneath the rust. Orders still hang beside the cells: keep the lower passages closed, admit no visitors, await relief.\n\nRelief never came. Guards and prisoners keep their old stations in a silence broken by dragging iron. Somewhere below, a lock turns although nobody holds the key.
journal.document.intros.caves.title=Caves
journal.document.intros.caves.body=Beyond the last cell, worked stone gives way to the mines. Cart tracks disappear over broken ledges; lamps mark routes whose bridges have long since fallen. The ore veins shine faintly even where your light cannot reach.\n\nThe dwarves built their city on what they hauled from here. Their abandoned machines still keep shift, and the things now living among them have learned the sound of an intruder's steps.
journal.document.intros.city.title=Dwarven Metropolis
journal.document.intros.city.body=The city below Grimhollow has no sky, only a vault of stone lost in smoke. Its doors were built for crowds. Its avenues are empty. From the palace comes the measured stroke of a hammer, then an answering sound too deep to be metal.\n\nEvery royal statue wears the same fresh crown over an older, chiseled-away face. Whatever bargain preserved this kingdom, its people are still paying.
journal.document.intros.halls.title=Demon Halls
journal.document.intros.halls.body=The palace foundations end here. Beyond them lie arches older than the city and seals driven into stone from the wrong side. Heat rises through the cracks without the smell of any earthly fuel.\n\nThe king was guarding something. Or feeding it. Far below, a small amber light keeps time with Grimhollow's empty bell. There is nowhere left to lay the blame, and only one way to reach the amulet.
journal.document.intros.halls.discover_hint=You can find this text in a specific region, but only after finding all prior texts in this set.

journal.document.sewers_guard.title=Guard's Letters
journal.document.sewers_guard.discover_hint=You can find this text in a specific region, but only after finding all prior texts in this set.
journal.document.sewers_guard.new_position.title=The Night Detail
journal.document.sewers_guard.new_position.body=Mara,\nThey have put me on the sluice detail. Double pay, dry boots promised, and a key with no number. The captain says it opens the prison service stair, though nobody on our shift is to use it.\nI have left this beneath the lamp bracket. If I bring it home, you may laugh at how solemn I sound. - Rook
journal.document.sewers_guard.dangerous.title=The Closed Gate
journal.document.sewers_guard.dangerous.body=The floodgate was closed from below. I can see the chain drawn tight on the far side. Nobody will explain how a crew got behind it, or why their names have been scraped from the roster.\nWe heard the bell through the pipework tonight. The tower has no bellringer left.
journal.document.sewers_guard.crabs.title=Broken Lantern
journal.document.sewers_guard.crabs.body=Something struck Ellis below the water. A crab, the captain said, as if a word could make it smaller. We dragged him onto the stones and spent our last salve on his leg.\nThe creature stayed under the bridge until our lantern went out. It knew exactly how long to wait.
journal.document.sewers_guard.guild.title=Marks on the Wall
journal.document.sewers_guard.guild.body=Someone is marking safe crossings in charcoal. Three strokes mean shallow water; a circle means a ladder still holds. Thieves, perhaps. Their signs have brought more of us home than the duty map.\nI added a cross where Ellis fell. By morning, someone had drawn seven more.
journal.document.sewers_guard.lost.title=The Wrong Footsteps
journal.document.sewers_guard.lost.body=Our chalk marks end at a wall that should be an open arch. The captain insists we have taken a wrong turn. Behind us I can hear a fourth pair of boots. There are only three of us now.\nWe have agreed to stop calling names into the dark.
journal.document.sewers_guard.not_worth.title=For Whoever Follows
journal.document.sewers_guard.not_worth.body=Mara,\nI am leaving by the service stair. There is no other dry way out. If a stranger finds this, leave the floodgate shut. The water is holding something back.\nKeep your wages. Keep your fine dry boots. I want a door that opens onto daylight. - Rook

journal.document.prison_warden.title=Warden's Journal
journal.document.prison_warden.discover_hint=You can find this text in a specific region, but only after finding all prior texts in this set.
journal.document.prison_warden.journal.title=Relief Ledger
journal.document.prison_warden.journal.body=No relief arrived. I have divided the remaining lamp oil between the outer gallery and the infirmary. The council's last order was to keep the gates barred until the disturbance below subsides.\nThey sent no date, no provisions, and no messenger willing to stay.
journal.document.prison_warden.recruits.title=Borrowed Keys
journal.document.prison_warden.recruits.body=We issued keys to six prisoners and asked them to carry water. Five returned. The sixth locked his empty cell behind him and left the key outside.\nI have told the recruits that discipline will steady the men. Writing it here does not make it less of a lie.
journal.document.prison_warden.mines.title=Orders Below
journal.document.prison_warden.mines.body=The mine stair is sealed. The workers begged to come through before we lowered the gate. I counted eleven lamps on the other side.\nTonight there are twelve. They stand in a straight line, perfectly still.
journal.document.prison_warden.rotberry.title=The Infirmary Garden
journal.document.prison_warden.rotberry.body=The healer's rotberry has put roots through the mortar. Its fruit ripens in darkness, and the orderlies swear the fever breaks when they crush it.\nI found a root around the ankle of a sleeping patient. It had not broken the skin. It had no need to.
journal.document.prison_warden.no_support.title=The Last Reply
journal.document.prison_warden.no_support.body=The speaking pipe carried an answer today. A clear voice gave the correct countersign, then asked us to send the sick below.\nOur speaking pipe goes upward. I had it filled with sand.
journal.document.prison_warden.letter.title=Unsent
journal.document.prison_warden.letter.body=To the surface watch:\nWe are still here. Stop sealing doors and calling the silence safety. There are living people beneath your streets.\nIf you cannot open the gate, send someone with the courage to come down the stairs. I will leave the outer lamps burning. - Warden Hale

journal.document.caves_explorer.title=Explorer's Log
journal.document.caves_explorer.discover_hint=You can find this text in a specific region, but only after finding all prior texts in this set.
journal.document.caves_explorer.expedition.title=Survey Marks
journal.document.caves_explorer.expedition.body=The contract names six workable seams and one abandoned city road. I have found the road. Its stones are warm, though the furnaces above have been cold for years.\nI will mark my route in white chalk. No promising ore is worth an unmarked turning.
journal.document.caves_explorer.gold.title=The Bright Seam
journal.document.caves_explorer.gold.body=The gold lies bare in the rock, untouched by picks. My partner says that means the last crew left in a hurry. I think it means they learned something.\nWe took a sample. Both of us dreamed of the same room.
journal.document.caves_explorer.troll.title=Terms of Trade
journal.document.caves_explorer.troll.body=A troll keeps a forge beside the old lifts. He asked for ore, not coin, and told us to stop listening when the stone began to speak.\nHe would explain no further. His hammer never missed a beat.
journal.document.caves_explorer.city.title=The Toll Road
journal.document.caves_explorer.city.body=At the city gate we found carts still waiting to enter. Each driver had placed a coin beneath the tongue of the statue beside the road.\nThe statue's mouth is now full. There is no wear on the coins.
journal.document.caves_explorer.alive.title=Shift Change
journal.document.caves_explorer.alive.body=A drilling machine followed us out of a collapsed heading. No operator, no fuel cart, no way its boiler could still be hot.\nIt stopped at the old shift bell. When the bell rang again, so did it.
journal.document.caves_explorer.report.title=Survey Closed
journal.document.caves_explorer.report.body=I have crossed out the profitable seams. Do not mistake this for a poor survey.\nThe mines lead into an occupied city. The gates are barred from within. The road carries warmth upward and footsteps downward. Whatever the dwarves bought, it is still being delivered.

journal.document.city_warlock.title=Warlock's Journal
journal.document.city_warlock.discover_hint=You can find this text in a specific region, but only after finding all prior texts in this set.
journal.document.city_warlock.old_king.title=The Empty Throne
journal.document.city_warlock.old_king.body=The old king's body has not cooled. His successor already wears the crown, and the palace furnaces burn without coal.\nWe were told the succession would be bloodless. I did not understand that to be a literal promise.
journal.document.city_warlock.resistance.title=The Counting House
journal.document.city_warlock.resistance.body=We meet beneath the counting house because the royal guard never checks rooms without gold. Seven of us have agreed to stop the furnace tithe.\nThe poor bring ash in place of fuel. The collectors accept it. We do not know what the furnaces are consuming.
journal.document.city_warlock.failure.title=A Familiar Voice
journal.document.city_warlock.failure.body=The guard found us. Our password came from the mouth of a man buried three winters ago.\nI survived by keeping still beneath him. His hand was warm. I cannot bear to write the rest.
journal.document.city_warlock.more_powerful.title=The Second Crown
journal.document.city_warlock.more_powerful.body=The king no longer eats at council. Each sentence leaves his mouth in two voices, one close and one beneath the floor.\nHis guard have stopped wearing names. They stand until the straps of their armor rot.
journal.document.city_warlock.new_power.title=The Price
journal.document.city_warlock.new_power.body=The furnace books record no fuel at all. They record years: the years of a mason's apprenticeship, a child's first winter, an old woman's promised rest.\nThe king has found a way to spend lives before they are lived. The city calls it endurance.
journal.document.city_warlock.seen_it.title=Beneath the Palace
journal.document.city_warlock.seen_it.body=I saw the lower seals open. There was no forge beyond them, only a vast eye and a bridge over heat.\nThe king knelt. I had thought him our master. Now I know where to look.

journal.document.halls_king.title=???'s Journal
journal.document.halls_king.discover_hint=You can find this text in a specific region, but only after finding all prior texts in this set.
journal.document.halls_king.rejection.title=A Small Kingdom
journal.document.halls_king.rejection.body=My counselors offered patience while the city starved. They asked me to die with dignity among cold furnaces and empty granaries.\nThere are older powers beneath this stone. None of them has yet told me to wait.
journal.document.halls_king.amulet.title=The Amber Light
journal.document.halls_king.amulet.body=The amulet was warm in the dark. It made no promises. When I held it, the bell above us answered for the first time in a century.\nI took that for consent.
journal.document.halls_king.ritual.title=The Opening
journal.document.halls_king.ritual.body=We broke the outer seal with royal tools. Behind it lay another, facing inward.\nThe oldest mason refused the next blow. I dismissed him. By morning the stone had opened itself.
journal.document.halls_king.new_king.title=The Bargain
journal.document.halls_king.new_king.body=The furnaces live. The granaries fill. My people cheer a king who has conquered want.\nOnly the palace clocks have stopped. I have ordered them covered; a kingdom does not need to hear every cost.
journal.document.halls_king.thing.title=What Answers
journal.document.halls_king.thing.body=It does not speak in words. It offers the moment before a death: the held breath, the falling hand, the step not yet taken.\nI have accepted so many that I no longer remember which moments were mine.
journal.document.halls_king.attrition.title=The Final Account
journal.document.halls_king.attrition.body=I meant to preserve a city. I have preserved its hunger.\nIf someone reaches these halls, take the amulet away from it. Do not bargain. Do not ask what can be saved. I asked, and it is still answering.

