name: Grimhollow build and acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
      - run: python -m pip install -r tools/artgen/requirements.txt
      - name: Build desktop distribution
        shell: bash
        run: ./gradlew desktop:dist -PdesktopOnly=true --console=plain
      - name: Full art acceptance gate
        run: python tools/artgen/validate.py
      - name: JUnit tests
        if: ${{ !cancelled() }}
        shell: bash
        run: ./gradlew core:test -PdesktopOnly=true --console=plain
      - name: Offscreen geometry acceptance 24-26
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: xvfb-run -a java -Dgrimhollow.geometryTests=true -jar "$(find desktop/build/libs -name 'desktop-*.jar' -print -quit)" --smoke-sewers
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: grimhollow-desktop-${{ matrix.os }}
          path: desktop/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew android:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: grimhollow-android-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
  headless-smoke:
    runs-on: ubuntu-latest
    needs: desktop
    if: ${{ !cancelled() }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Three classes, ten seeds each, through floor 6
        run: ./gradlew core:smokeRun -PdesktopOnly=true --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grimhollow-headless-logs
          path: core/build/reports/smoke/
          retention-days: 14

  necromancer-smoke:
    runs-on: ubuntu-latest
    needs: desktop
    if: ${{ !cancelled() }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Necromancer, ten seeds, class features and floor 6
        run: ./gradlew core:smokeRun -PsmokeClass=NECROMANCER -PdesktopOnly=true --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grimhollow-necromancer-logs
          path: core/build/reports/smoke/
          retention-days: 14

  enchanter-smoke:
    runs-on: ubuntu-latest
    needs: desktop
    if: ${{ !cancelled() }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enchanter, ten seeds, class features and floor 6
        run: ./gradlew core:smokeRun -PsmokeClass=ENCHANTER -PdesktopOnly=true --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grimhollow-enchanter-logs
          path: core/build/reports/smoke/
          retention-days: 14

  psychic-smoke:
    runs-on: ubuntu-latest
    needs: desktop
    if: ${{ !cancelled() }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Psychic, ten seeds, class features and floor 6
        run: ./gradlew core:smokeRun -PsmokeClass=PSYCHIC -PdesktopOnly=true --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grimhollow-psychic-logs
          path: core/build/reports/smoke/
          retention-days: 14
