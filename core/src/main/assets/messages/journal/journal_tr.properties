journal.document.adventurers_guide.title=Zindan Ustalığı Kitabı
journal.document.adventurers_guide.intro.title=Giriş
journal.document.adventurers_guide.intro.body=Selamlar Maceracı, Zindan Ustalığı Kitabı'nı okuyorsun! Bu rehber kitap en iyi başvuru kaynağı olarak kullanılır ve her sayfayı ne zaman okumanız gerektiğini sihirli bir şekilde size bildirir.\n\n(Günlük düğmesi yanıp söndüğünde, kılavuz kitabın size söyleyeceklerini okumak için onu seçin! Bazı sayfalar eksik, belki onları zindanda bulabilirsin).
journal.document.adventurers_guide.examining.title=İncelemek
journal.document.adventurers_guide.examining.body=Körü körüne saldırmak yerine düşmanlarınızı ve çevrenizi incelemek önemlidir! Yeni olan her şeyi inceleme alışkanlığı edinin.\n\n(Büyüteç düğmesini kullanarak ve ardından incelemek istediğinizi seçerek inceleyebilirsiniz. Ayrıca simgelerini seçerek güçlendirmeleri veya zayıflatmaları da inceleyebilirsiniz).
journal.document.adventurers_guide.surprise_attacks.title=Sürpriz Saldırılar
journal.document.adventurers_guide.surprise_attacks.body=Sürpriz saldırıların isabet etmesi garantidir, bu da onları özellikle yılanlar ve hayaletler gibi kaçan düşmanlara karşı kullanışlı hale getirir.\n\nDüşmanlar sizi kovalarken bir kapı aralığına girdikten hemen sonra veya sizi gözden kaybettiklerinde onları şaşırtabilirsiniz.
journal.document.adventurers_guide.identifying.title=Eşyaları Tanımlamak
journal.document.adventurers_guide.identifying.body=İksirlerin renkleri ve parşömenlerin üzerindeki semboller her zindanda farklıdır. Tanımlanamayan ekipman, şanslıysanız yükseltilebilir veya büyülenebilir ya da lanetli olabilir!\n\nTanımlanmamış ekipman kullanma riskini azaltmak istiyorsanız, tanımlama, yükseltme veya laneti kaldırma parşömenleri çok kullanışlıdır.\n\n(Tanımladığınız tüm eşyaların bir listesini günlüğünüzün katalog sekmesinde bulabilirsiniz)
journal.document.adventurers_guide.food.title=Açlıkla Başa Çıkmak
journal.document.adventurers_guide.food.body=Etkili bir şekilde rasyon yapmak hayatta kalma şansınızı artırmanın en iyi yollarından biridir, her zaman acıktığınız anda yemek yemeniz gerekmez!\n\nAçlıktan ölmediğinizde yavaşça sağlığınızı yenileyeceksiniz, bu nedenle tam sağlıkla yemek yerseniz bu yenilenme boşa gidecektir!\n\nSağlığınıza göre ne zaman yemek yiyeceğinizi ayarlarsanız, yiyecekleriniz çok daha uzun süre dayanır.
journal.document.adventurers_guide.alchemy.title=Simya & Tılsımlar
journal.document.adventurers_guide.alchemy.body=İşe yaramayan sarf malzemeleri simyada kullanılabilir veya enerjiye dönüştürülebilir. Güç veren iksirler ve parşömenler kullanıldığında otomatik olarak tanımlanır.\n\nTılsımlar, simya ile yapılan özel ekipmanlardır. Üretmek için bir tılsım katalizörü ve biraz simya enerjisi yeterlidir.\n\n(İlk simya kazanı zindanın 3. veya 4. katında bulunur. Yakınında tarif sayfaları da yer alır.)
journal.document.adventurers_guide.dieing.title=Hezimeti Hazmetmek
journal.document.adventurers_guide.dieing.body=Zindancılık tehlikelidir ve çoğu maceracı sonunda ölümle karşılaşır.\n\nŞans yardımcı olur, ancak en iyi maceracılar şanslarını artırmak için her küçük numarayı kullanırlar.\n\n(Çok fazla ölüyorsanız üzülmeyin, bu oyun zor! Oyunu öğrenmeye ve sürekli gelişmeye odaklanın, hemen kazanmaya değil).
journal.document.adventurers_guide.searching.title=Aramak
journal.document.adventurers_guide.searching.body=Zindanlar ilk bakışta görünmeyen gizli kapılar ve tuzaklarla doludur. Yakınlarda bir kapı veya tuzak olduğundan şüpheleniyorsanız biraz zaman harcayıp dikkatlice arayabilirsiniz.\n\n(Büyüteç düğmesini iki kez kullanarak etrafınızdaki tüm karoları arayabilirsiniz. Belki de bu sayfayı bulduğunuz yerin yakınlarında gizli kapılar vardır!)
journal.document.adventurers_guide.strength.title=Güç
journal.document.adventurers_guide.strength.body=Zindanda bulduğunuz silah ve zırhlarla antrenman yapacak vaktiniz yok, bu yüzden onları etkili bir şekilde kullanmak için kaba kuvvete ihtiyacınız olacak.\n\nGüç iksirleri ve yükseltme parşömenleri, daha yüksek seviye teçhizatın güç gereksinimlerini karşılamanın en etkili yoludur.\n\nSonunda yüksek seviyeli eşyaları kullanmaya başlamak önemlidir, ancak şu anda kullanabileceğiniz ekipmanları göz ardı etmeyin.
journal.document.adventurers_guide.upgrades.title=Yükseltmeler
journal.document.adventurers_guide.upgrades.body=Bir zindanda ne kadar derine inerseniz, sihirle yükseltilmiş yüksek seviye teçhizat kullanmanız o kadar önemli hale gelir, ancak bunları doğru şekilde kullanmak için güce de ihtiyacınız olacaktır.\n\nDeğnekler, yüzükler ve eserler güce ihtiyaç duymaz, ancak sınırlı kullanımları vardır veya savaşta doğrudan yardımcı olmazlar.\n\nNeyi yükselteceğiniz konusunda iyi seçimler yapmak, zindanın başlarında hayatta kalmak ve zindanın ilerleyen bölümlerinde kendinizi başarıya hazırlamak için çok önemlidir.
journal.document.adventurers_guide.looting.title=Etkili Yağmalama
journal.document.adventurers_guide.looting.body=Kilitli kapıların ardında bulunan veya engeller içeren odalar genellikle daha iyi ganimetlere sahiptir. Bir engel yolunuzu kestiğinde, genellikle aynı katta size yardımcı olacak bir eşya bulabilirsiniz.\n\nHer beş katlı zindan bölgesinde her zaman 2 güç iksiri ve 3 yükseltme parşömeni bulabilirsiniz, bu nedenle bunlar ne kadar iyi keşif yaptığınızın harika bir göstergesidir.\n\n(Günlük penceresinin notlar sekmesinde yer işaretlerinin ve kullanılmayan anahtarların bir listesini görebilirsiniz).
journal.document.adventurers_guide.levelling.title=Deneyim Kazanma
journal.document.adventurers_guide.levelling.body=Seviye atlamak istatistiklerinizi artırır ve yetenek puanları kazandırır, bu da savaşta büyük bir fark yaratabilir. Zindanın her katı için en az bir seviyeye sahip olmak en iyisidir.\n\nAcele etmek ve keşif veya savaştan kaçınmak cazip gelebilir, ancak bunu yapmak sizi erzak ve deneyimden mahrum bırakacaktır.\n\n(Kahramanınız hakkındaki bilgileri, deneyim de dahil olmak üzere, oyun arayüzünün köşesindeki durum bölmesinde görebilirsiniz. Daha fazla bilgi almak için kahramanınızın portresini seçin).
journal.document.adventurers_guide.positioning.title=Konumlanmak
journal.document.adventurers_guide.positioning.body=Strateji en az ekipman kadar önemlidir. Etrafınızın sarılması gibi kötü durumlardan genellikle iyi bir konumlandırma ile kaçınılabilir.\n\nÖrneğin, çoğu zindanda düşmanları sizinle teker teker savaşmaya zorlayan ince koridorlar vardır. Bu koridorlarda genellikle sürpriz saldırılar için kapı girişleri de bulunur!\n\nÇimen, su, çukurlar veya tuzaklar gibi çevre özelliklerini avantajınıza kullanmanın birçok küçük yolu da vardır.
journal.document.adventurers_guide.magic.title=Büyülü Saldırılar
journal.document.adventurers_guide.magic.body=Büyülü saldırılar zırhı deler geçer ve kaçması zordur. Bu, değneklerden gelen hasarın çok güvenilir olduğu anlamına gelir, ancak aynı zamanda büyülü düşmanları çok tehlikeli hale getirir!\n\nBüyülü saldırıların her zaman bir dezavantajı vardır. Değneklerin şarjları sınırlıdır ve büyülü düşmanlar genellikle büyülerini yakın mesafeden kullanamazlar.\n\nBüyü kullanan düşmanlarla karşılaştığınızda, size karşı büyü kullanmalarını nasıl engelleyeceğinizi öğrenmek önemlidir.

journal.document.alchemy_guide.title=Simya Kılavuzu
journal.document.alchemy_guide.potions.title=Giriş ve İksirler
journal.document.alchemy_guide.potions.body=Alşiminin Pratik Uygulamalarına hoş geldiniz! Bu kitap, simya kazanında eşya yapmak için kullanılan tariflerden oluşan bir başvuru kaynağıdır.\n\nEn ikonik tarifle başlayacağız: İksirler!\n\nRastgele bir iksir yapmak için üç tohum kullanın! Her tohumun bir iksir eşdeğeri vardır, iksirin kullandığınız tohumlarla ilişkili olma şansını artırmak için aynı tohumdan birden fazla kullanın.
journal.document.alchemy_guide.stones.title=Rüntaşları Oluşturma
journal.document.alchemy_guide.stones.body=Bir parşömeni bir simya kabına karıştırmak, sihrini kabın içindeki iki kayaya aşılayacaktır. Bu, rün taşları yaratır ve parşömeni tanımlar!
journal.document.alchemy_guide.energy_food.title=Enerji ve Yemek
journal.document.alchemy_guide.energy_food.body=Birçok tarif kristal simya enerjisi gerektirir, bu da tüketilebilir öğelerin bir simya kabında ayrıştırılmasıyla elde edilir. Enerji veren iksirler veya parşömenler de bunları tanımlar.\n\nEnerji gerektiren bazı tarifler büyülüdür, ancak bunlar geleneksel yemek pişirmeye benzer.
journal.document.alchemy_guide.exotic_potions.title=Egzotik İksirler
journal.document.alchemy_guide.exotic_potions.body=İksirler enerjiyle karıştırılarak egzotik iksirler üretilebilir. Bunların daha kuvvetli etkileri vardır, fakat genelde farklı şekillerde işe yararlar.
journal.document.alchemy_guide.exotic_scrolls.title=Egzotik Parşömenler
journal.document.alchemy_guide.exotic_scrolls.body=Egzotik parşömenler biraz enerji ve bir parşömenle yapılır. Egzotik iksirlerden biraz daha güçlü ve pahalıdırlar.
journal.document.alchemy_guide.bombs.title=Geliştirilmiş Bombalar
journal.document.alchemy_guide.bombs.body=Normal bir bomba belirli eşyalarla birleştirilerek geliştirilmiş bir bombaya dönüştürülebilir.
journal.document.alchemy_guide.weapons.title=Silahları Geliştirmek
journal.document.alchemy_guide.weapons.body=Daha hafif veya daha büyülü silahlardan bazıları alşimide kullanılabilir!\n\nFırlatılan her silah seti, aynı seviye ve kademedeki başka bir seti tamamen onarmaya yetecek kadar sıvı metal üretir. Bir setin simyalanmasının, tamamı mevcut olmasa bile tüm seti yok edeceğini unutmayın!\n\nBir değnek, aynı seviyedeki iki değneği yükseltmeye yetecek kadar gizemli reçine üretir, ancak +3'ten daha yüksek olamaz.
journal.document.alchemy_guide.brews_elixirs.title=Karışımlar ve Özütler
journal.document.alchemy_guide.brews_elixirs.body=Karışımlar ve iksirler, genellikle tek kullanımla çeşitli etkilere sahip gelişmiş iksirlerdir.
journal.document.alchemy_guide.spells.title=Büyüler
journal.document.alchemy_guide.spells.body=Büyüler kristallerin içinde bulunurlar ve genellikle birden fazla kullanımla çeşitli etkiler sağlarlar.

