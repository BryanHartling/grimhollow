journal.document.adventurers_guide.title=Tomo de la Maestría de Mazmorras
journal.document.adventurers_guide.intro.title=Introducción
journal.document.adventurers_guide.intro.body=Saludos, Aventurero, ¡estás leyendo el Tomo de Maestría en Mazmorras! Esta guía es ideal como referencia y te indicará mágicamente cuándo es mejor leer cada página.\n\n(Cuando el botón del diario parpadee, selecciónalo para leer lo que la guía tiene para decirte. Sin embargo, faltan algunas páginas, ¿quizás puedas encontrarlas en la mazmorra?)
journal.document.adventurers_guide.examining.title=Examinar
journal.document.adventurers_guide.examining.body=Es importante estudiar a tus enemigos y el entorno en lugar de lanzarte a ciegas. Acostúmbrate a examinar todo lo nuevo.\n\n(Puedes examinar algo usando el botón de la lupa y luego seleccionar lo que deseas examinar. También puedes examinar los efectos de estado que afectan a un personaje seleccionando sus iconos.)
journal.document.adventurers_guide.surprise_attacks.title=Ataques Sorpresa
journal.document.adventurers_guide.surprise_attacks.body=Los ataques sorpresa tienen un impacto garantizado, lo que los hace especialmente útiles contra enemigos evasivos como serpientes y espectros.\n\nPuedes sorprender a los enemigos justo después de que entren por una puerta mientras te persiguen o cuando te pierden de vista.
journal.document.adventurers_guide.identifying.title=Identificación de ítems
journal.document.adventurers_guide.identifying.body=Los colores de las pociones y los símbolos de los pergaminos son diferentes en cada mazmorra. El equipamiento sin identificar puede estar mejorado o encantado si tienes suerte, ¡o podría estar maldito!\n\nLos pergaminos de identificación, mejora o de eliminar maldición son muy útiles si quieres reducir el riesgo de usar equipamiento sin identificar.\n\n(Puedes encontrar una lista de todos los ítems que has identificado en la pestaña de ítems de tu diario)
journal.document.adventurers_guide.food.title=Lidiando con el Hambre
journal.document.adventurers_guide.food.body=Racionar eficazmente es una de las mejores maneras de aumentar tus probabilidades de supervivencia. ¡No siempre necesitas comer justo cuando tienes hambre!\n\nMientras no estés famélico, regenerarás salud lentamente, así que si comes con la salud al máximo, esa regeneración se desperdiciará.\n\nSi racionas tus comidas en función de tu salud, tus provisiones deberían durar mucho más.
journal.document.adventurers_guide.alchemy.title=Alquimia y Ornamentos
journal.document.adventurers_guide.alchemy.body=Si un consumible no te resulta útil, puedes usarlo como ingrediente de alquimia o convertirlo en energía alquímica de uso general. ¡Convertir pociones y pergaminos también los identifica!\n\nLas ornamentos son un tipo de equipo único que se crea y mejora mediante la alquimia. Se crean con un catalizador mágico de ornamento y un poco de energía alquímica.\n\n(El primer recipiente de alquimia está en el piso 3 o 4 de la mazmorra. También hay páginas del libro de recetas de alquimia cerca de estos calderos.)
journal.document.adventurers_guide.dieing.title=Manejando la Derrota
journal.document.adventurers_guide.dieing.body=Ser explorador de mazmorras es peligroso y la mayoría de aventureros fallecen tarde o temprano.\n\nLa suerte ayuda, pero los mejores aventureros aprovechan cualquier pequeño truco para aumentar sus posibilidades.\n\n(No te preocupes si mueres mucho, ¡este juego es difícil! Concéntrate en aprender y mejorar constantemente, no en ganar de inmediato.)
journal.document.adventurers_guide.searching.title=Buscar
journal.document.adventurers_guide.searching.body=Las mazmorras están llenas de puertas secretas y trampas que parecen invisibles a primera vista. Puedes dedicar un tiempo a buscar con cuidado si sospechas que hay una puerta o trampa cerca.\n\n(Puedes buscar en todas las casillas a tu alrededor usando el botón de lupa dos veces. ¡Tal vez haya algunas puertas ocultas cerca de donde encontraste esta página!)
journal.document.adventurers_guide.strength.title=Fuerza
journal.document.adventurers_guide.strength.body=No hay tiempo para entrenar con las armas y armaduras que encuentres en la mazmorra, así que necesitarás fuerza bruta para usarlas con eficacia.\n\nLas pociones de fuerza y pergaminos de mejora son la forma más eficaz de alcanzar los requisitos de fuerza del equipamiento de mayor nivel.\n\nEs importante comenzar a utilizar equipamiento de alto nivel, pero no ignores el equipamiento que puedes usar ahora mismo.
journal.document.adventurers_guide.upgrades.title=Mejoras
journal.document.adventurers_guide.upgrades.body=Cuanto más desciendas en la mazmorra, más importante es que uses equipamiento de alto nivel mejorado mágicamente, pero también necesitarás la fuerza para usarlo correctamente.\n\nLas varitas, los anillos y los artefactos no necesitan fuerza para utilizarse, pero tienen usos limitados o no ayudan tan directamente en combate.\n\nTomar buenas decisiones sobre qué mejorar es muy importante para sobrevivir los comienzos de la mazmorra, y para encaminarte al éxito más tarde.
journal.document.adventurers_guide.looting.title=Saqueo Efectivo
journal.document.adventurers_guide.looting.body=Las habitaciones con puertas cerradas o que contienen obstáculos suelen tener mejor botín. Cuando un obstáculo bloquea tu camino, normalmente puedes encontrar un objeto que te ayude a desbloquearlo en el mismo piso.\n\nSiempre encontrarás 2 pociones de fuerza y 3 pergaminos de mejora en cada región de mazmorra, donde cada región se compone de cinco pisos, así que son un buen indicador de tu progreso en la exploración..\n\n(Puedes ver una lista de puntos de referencia y llaves sin utilizar en la pestaña de notas en la ventana del diario.)
journal.document.adventurers_guide.levelling.title=Ganando Experiencia
journal.document.adventurers_guide.levelling.body=Subir de nivel aumenta tus estadísticas y otorga puntos de talento, lo que puede marcar una gran diferencia en combate. Lo mejor es tener al menos un nivel de experiencia por cada piso de la mazmorra.\n\nPuede ser tentador correr y evitar la exploración o el combate, pero hacerlo te privará tanto de suministros como de experiencia.\n\n(Puedes ver información sobre tu héroe, incluyendo su experiencia, en el panel de estado en la esquina de la interfaz del juego. Selecciona el retrato de tu héroe para obtener aún más información.)
journal.document.adventurers_guide.positioning.title=Posicionarse
journal.document.adventurers_guide.positioning.body=La estrategia es tan importante como el equipamiento. Situaciones difíciles como verse rodeado suelen evitarse con un buen posicionamiento.\n\nPor ejemplo, la mayoría de las mazmorras tienen pasillos estrechos que obligan a los enemigos a luchar uno a uno. ¡Estos pasillos también suelen tener puertas para ataques sorpresa!\n\nTambién hay muchas maneras de aprovechar elementos del entorno como la hierba, el agua, las fosas o las trampas.
journal.document.adventurers_guide.magic.title=Ataques Mágicos
journal.document.adventurers_guide.magic.body=Los ataques mágicos atraviesan la armadura y son difíciles de esquivar. Esto significa que el daño de tus varitas será muy confiable, ¡pero esto también hace a los enemigos mágicos muy peligrosos!\n\nLos ataques mágicos siempre tienen un inconveniente. Las varitas tienen cargas limitadas y los enemigos mágicos normalmente no serán capaces de usar su magia cuerpo a cuerpo.\n\nCuando te enfrentes a enemigos que usan magia es importante aprender cómo prevenir que la usen contra ti.

journal.document.alchemy_guide.title=Guía de Alquimia
journal.document.alchemy_guide.potions.title=Introducción y Pociones
journal.document.alchemy_guide.potions.body=¡Bienvenidos a Aplicaciones Prácticas de la Alquimia! Este libro es una referencia de recetas para crear objetos en un caldero de alquimia.\n\nComenzaremos con la receta más emblemática: ¡Pociones!\n\n¡Usa tres semillas para preparar una poción al azar! Cada semilla tiene su equivalente en forma de poción. Usa varias de la misma semilla para aumentar la probabilidad de que la poción se relacione con las semillas que usaste.
journal.document.alchemy_guide.stones.title=Creando Piedras Rúnicas
journal.document.alchemy_guide.stones.body=Mezclar un pergamino en un caldero de alquimia imbuirá su magia en dos rocas dentro de la olla. ¡Esto crea piedras rúnicas e identifica el pergamino!
journal.document.alchemy_guide.energy_food.title=Energía y Comida
journal.document.alchemy_guide.energy_food.body=Muchas recetas requieren energía alquímica cristalizada, que se obtiene al deconstruir ítems consumibles en un caldero de alquimia. Convertir pociones y pergaminos también los identifica.\n\nAlgunas recetas que requieren energía son mágicas, pero éstas se parecen a la cocina tradicional.
journal.document.alchemy_guide.exotic_potions.title=Pociones Exóticas
journal.document.alchemy_guide.exotic_potions.body=Las pociones se pueden mezclar con energía para crear pociones exóticas. Tienen efectos más poderosos, pero pueden ser útiles de diferentes formas.
journal.document.alchemy_guide.exotic_scrolls.title=Pergaminos Exóticos
journal.document.alchemy_guide.exotic_scrolls.body=Se pueden hacer pergaminos exóticos con algo de energía y un pergamino. Son un poco más fuertes y costosos que las pociones exóticas.
journal.document.alchemy_guide.bombs.title=Bombas Mejoradas
journal.document.alchemy_guide.bombs.body=Una bomba negra de pólvora estándar se puede mezclar con un ítem específico para crear una bomba mejorada.
journal.document.alchemy_guide.weapons.title=Potenciando Armamento
journal.document.alchemy_guide.weapons.body=¡Algunas de las armas más ligeras o mágicas se pueden usar en alquimia!\n\nCada arma arrojadiza produce suficiente metal liquido para reparar otra arma del mismo nivel y tier. ¡Ten en cuenta que convertir un conjunto destruirá todo el conjunto, incluso si parte del mismo no está presente!\n\nUna varita producirá suficiente resina arcana para mejorar dos varitas del mismo nivel pero no por encima de +3.
journal.document.alchemy_guide.brews_elixirs.title=Infusiones y Elixires
journal.document.alchemy_guide.brews_elixirs.body=Las infusiones y elixires son pociones avanzadas con una variedad de efectos, usualmente de un solo uso.
journal.document.alchemy_guide.spells.title=Hechizos
journal.document.alchemy_guide.spells.body=Los hechizos están contenidos en cristales y proporcionan una variedad de efectos, usualmente con múltiples usos.

