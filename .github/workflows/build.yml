name: Grimhollow build and acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch immutable upstream restoration source
        run: git fetch https://github.com/00-Evan/shattered-pixel-dungeon.git refs/tags/v4.0.0:refs/tags/v4.0.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
      - run: python -m pip install Pillow==12.3.0 numpy==2.3.5
      - name: Build desktop distribution
        shell: bash
        run: ./gradlew desktop:dist -PdesktopOnly=true --no-daemon --console=plain
      - name: Package native Windows launcher with painted icon and bundled runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/package-windows.ps1
      - name: Update helper validation and rollback safeguards
        if: runner.os == 'Windows'
        run: python tools/updates/test_windows.py
      # Recovery supersedes generated-art tests 3/4/17/18/28-30/35/39-42.
      # Their implementations and historical evidence remain in the repository.
      # Painted world sources are committed; CI verifies the offline packer too.
      # No generation service, artgen iteration or Blender is required.
      - name: Character provenance and reproducible painted atlases (test 44)
        run: python tools/recovery_assets.py --check
      - name: JUnit tests including navigation policy
        if: ${{ !cancelled() }}
        shell: bash
        run: ./gradlew core:test -PdesktopOnly=true --no-daemon --console=plain
      - name: Compiled handlers and network call audit (test 46)
        if: ${{ !cancelled() }}
        shell: bash
        run: python tools/recovery_checks.py --jar "$(find desktop/build/libs -name 'desktop-*.jar' -print -quit)"
      - name: Fog alignment (47), remembered terrain, walking, geometry and menu handlers
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: bash
        run: |
          result=0
          for index in 0 1 2 3 4; do
            options=()
            if [ "$index" = 0 ]; then
              options=(-Dgrimhollow.geometryTests=true -Dgrimhollow.effectsTests=true)
            fi
            xvfb-run -a java -Dgrimhollow.recovery=true -Dgrimhollow.fogTests=true -Dgrimhollow.region=$index "${options[@]}" -jar "$(find desktop/build/libs -name 'desktop-*.jar' -print -quit)" --smoke-sewers || result=1
          done
          exit "$result"
      # Test 45: Abandoned: test failed (user decision, 2026-10-01).
      # Historical measurements remain in verification/recovery; do not rerun.
      - name: Necromancer live encounters, actor drops and death rendering
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: bash
        run: xvfb-run -a java -Duser.home="$RUNNER_TEMP/grimhollow-encounters" -Dgrimhollow.encounterTests=true -Dgrimhollow.encounterFixture=true -jar "$(find desktop/build/libs -name 'desktop-*.jar' -print -quit)" --smoke-sewers
      - name: Updated welcome screen acknowledges healthy startup without player input
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: bash
        run: |
          root="$RUNNER_TEMP/grimhollow-update-startup"
          marker="$root/.local/share/.grimhollow/grimhollow/updates/launch-health.txt"
          mkdir -p "$(dirname "$marker")"
          xvfb-run -a env XDG_DATA_HOME="$root/.local/share" GRIMHOLLOW_UPDATE_HEALTH_FILE="$marker" GRIMHOLLOW_UPDATE_HEALTH_TOKEN=0123456789abcdef0123456789abcdef java -Duser.home="$root" -Dgrimhollow.updateBootReview=true -Dgrimhollow.smokeDir=verification/interface/landscape -jar "$(find desktop/build/libs -name 'desktop-*.jar' -print -quit)" --smoke-title
      - name: Painted interface in landscape and portrait
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: bash
        run: |
          for orientation in landscape portrait; do
            portrait=false
            if [ "$orientation" = portrait ]; then portrait=true; fi
            xvfb-run -a java -Duser.home="$RUNNER_TEMP/grimhollow-updates-$orientation" -Dgrimhollow.updateReview=true -Dgrimhollow.interfacePortrait=$portrait -Dgrimhollow.smokeDir="verification/interface/$orientation" -jar "$(find desktop/build/libs -name 'desktop-*.jar' -print -quit)" --smoke-title
            xvfb-run -a java -Duser.home="$RUNNER_TEMP/grimhollow-profiles-$orientation" -Dgrimhollow.interfaceReview=true -Dgrimhollow.profileReview=true -Dgrimhollow.interfacePortrait=$portrait -Dgrimhollow.smokeDir="verification/interface/$orientation" -jar "$(find desktop/build/libs -name 'desktop-*.jar' -print -quit)" --smoke-sewers
            xvfb-run -a java -Duser.home="$RUNNER_TEMP/grimhollow-ui-$orientation" -Dgrimhollow.interfaceReview=true -Dgrimhollow.interfacePortrait=$portrait -Dgrimhollow.smokeDir="verification/interface/$orientation" -jar "$(find desktop/build/libs -name 'desktop-*.jar' -print -quit)" --smoke-sewers
            xvfb-run -a java -Duser.home="$RUNNER_TEMP/grimhollow-rooms-$orientation" -Dgrimhollow.interfaceReview=true -Dgrimhollow.roomReview=true -Dgrimhollow.interfacePortrait=$portrait -Dgrimhollow.smokeDir="verification/interface/$orientation" -jar "$(find desktop/build/libs -name 'desktop-*.jar' -print -quit)" --smoke-sewers
            xvfb-run -a java -Duser.home="$RUNNER_TEMP/grimhollow-expedition-$orientation" -Dgrimhollow.interfaceReview=true -Dgrimhollow.expeditionReview=true -Dgrimhollow.interfacePortrait=$portrait -Dgrimhollow.smokeDir="verification/interface/$orientation" -jar "$(find desktop/build/libs -name 'desktop-*.jar' -print -quit)" --smoke-sewers
            xvfb-run -a java -Duser.home="$RUNNER_TEMP/grimhollow-horror-$orientation" -Dgrimhollow.interfaceReview=true -Dgrimhollow.horrorReview=true -Dgrimhollow.heroClass=WARRIOR -Dgrimhollow.interfacePortrait=$portrait -Dgrimhollow.smokeDir="verification/interface/$orientation" -jar "$(find desktop/build/libs -name 'desktop-*.jar' -print -quit)" --smoke-sewers
            xvfb-run -a java -Duser.home="$RUNNER_TEMP/grimhollow-polish-$orientation" -Dgrimhollow.interfaceReview=true -Dgrimhollow.polishReview=true -Dgrimhollow.interfacePortrait=$portrait -Dgrimhollow.smokeDir="verification/interface/$orientation" -jar "$(find desktop/build/libs -name 'desktop-*.jar' -print -quit)" --smoke-sewers
            xvfb-run -a java -Duser.home="$RUNNER_TEMP/grimhollow-bounty-$orientation" -Dgrimhollow.interfaceReview=true -Dgrimhollow.bountyReview=true -Dgrimhollow.interfacePortrait=$portrait -Dgrimhollow.smokeDir="verification/interface/$orientation" -jar "$(find desktop/build/libs -name 'desktop-*.jar' -print -quit)" --smoke-sewers
          done
      - name: Vault boss arena and elemental forms in the existing renderer
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: xvfb-run -a java -Dgrimhollow.vault=true -jar "$(find desktop/build/libs -name 'desktop-*.jar' -print -quit)" --smoke-sewers
      - name: Painted class selection and complete progression in both orientations
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: bash
        run: |
          for orientation in landscape portrait; do
            portrait=false
            if [ "$orientation" = portrait ]; then portrait=true; fi
            xvfb-run -a java -Duser.home="$RUNNER_TEMP/grimhollow-presentation-$orientation" -Dgrimhollow.presentationReview=true -Dgrimhollow.interfacePortrait=$portrait -Dgrimhollow.smokeDir="verification/interface/$orientation" -jar "$(find desktop/build/libs -name 'desktop-*.jar' -print -quit)" --smoke-sewers
          done
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: grimhollow-recovery-evidence-${{ matrix.os }}
          path: |
            verification/recovery/
            verification/interface/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: grimhollow-desktop-${{ matrix.os }}
          path: desktop/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        with:
          name: grimhollow-windows-app
          path: desktop/build/windows/*/Grimhollow/
          if-no-files-found: error
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew android:assembleDebug --no-daemon --console=plain
      - name: Prepare the persistent Android signing identity
        env:
          KEYSTORE_B64: ${{ secrets.GRIMHOLLOW_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.GRIMHOLLOW_ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.GRIMHOLLOW_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo '::error::Update release signing secrets are missing; refusing to publish an incompatible APK.'
              exit 1
            fi
            echo 'Signed update APK not built: signing secrets are not configured.'
            exit 0
          fi
          python -c 'import base64,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"grimhollow.p12").write_bytes(base64.b64decode(os.environ["KEYSTORE_B64"],validate=True))'
          echo "GRIMHOLLOW_ANDROID_KEYSTORE=$RUNNER_TEMP/grimhollow.p12" >> "$GITHUB_ENV"
      - name: Build and verify the update APK
        if: env.GRIMHOLLOW_ANDROID_KEYSTORE != ''
        env:
          GRIMHOLLOW_ANDROID_STORE_PASSWORD: ${{ secrets.GRIMHOLLOW_ANDROID_STORE_PASSWORD }}
          GRIMHOLLOW_ANDROID_KEY_PASSWORD: ${{ secrets.GRIMHOLLOW_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          ./gradlew android:assembleUpdate --no-daemon --console=plain
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/build/outputs/apk/update/android-update.apk > "$RUNNER_TEMP/apk-cert.txt"
          python -c 'import pathlib,re,os; expected=pathlib.Path("tools/updates/android-cert.sha256").read_text().strip(); actual=re.search(r"Signer #1 certificate SHA-256 digest: ([0-9a-f]+)",pathlib.Path(os.environ["RUNNER_TEMP"],"apk-cert.txt").read_text())[1]; assert actual==expected,"Android signing identity differs from installed local builds"'
      - uses: actions/upload-artifact@v4
        if: env.GRIMHOLLOW_ANDROID_KEYSTORE != ''
        with:
          name: grimhollow-android-update
          path: android/build/outputs/apk/update/android-update.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: grimhollow-android-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
  headless-smoke:
    runs-on: ubuntu-latest
    needs: desktop
    if: ${{ !cancelled() }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Three classes, ten seeds each, through floor 6
        run: ./gradlew core:smokeRun -PdesktopOnly=true --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grimhollow-headless-logs
          path: core/build/reports/smoke/
          retention-days: 14

  necromancer-smoke:
    runs-on: ubuntu-latest
    needs: desktop
    if: ${{ !cancelled() }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Necromancer, ten seeds, class features and floor 6
        run: ./gradlew core:smokeRun -PsmokeClass=NECROMANCER -PdesktopOnly=true --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grimhollow-necromancer-logs
          path: core/build/reports/smoke/
          retention-days: 14

  enchanter-smoke:
    runs-on: ubuntu-latest
    needs: desktop
    if: ${{ !cancelled() }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enchanter, ten seeds, class features and floor 6
        run: ./gradlew core:smokeRun -PsmokeClass=ENCHANTER -PdesktopOnly=true --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grimhollow-enchanter-logs
          path: core/build/reports/smoke/
          retention-days: 14

  psychic-smoke:
    runs-on: ubuntu-latest
    needs: desktop
    if: ${{ !cancelled() }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Psychic, ten seeds, class features and floor 6
        run: ./gradlew core:smokeRun -PsmokeClass=PSYCHIC -PdesktopOnly=true --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grimhollow-psychic-logs
          path: core/build/reports/smoke/
          retention-days: 14

  publish-update:
    name: Publish verified update release
    needs: [desktop, android, headless-smoke, necromancer-smoke, enchanter-smoke, psychic-smoke]
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==50.0.2
      - uses: actions/download-artifact@v4
        with:
          name: grimhollow-windows-app
          path: release-input/windows
      - uses: actions/download-artifact@v4
        with:
          name: grimhollow-android-update
          path: release-input/android
      - name: Build and sign release manifest and packages
        env:
          GRIMHOLLOW_UPDATE_PRIVATE_KEY_B64: ${{ secrets.GRIMHOLLOW_UPDATE_PRIVATE_KEY_B64 }}
          GRIMHOLLOW_RELEASE_NOTES: In-game updates, verified downloads, persistent Android signing, and guarded Windows installation with rollback.
        run: python tools/updates/release.py build --directory release-output --windows release-input/windows --apk release-input/android/android-update.apk --tag "$GITHUB_REF_NAME"
      - name: Publish all assets together from a draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          # Never replace an existing release or redirect latest to an incomplete draft.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo '::error::This release already exists. Use a new version instead of replacing signed assets.'
            exit 1
          fi
          flags=()
          latest=true
          if [[ "$GITHUB_REF_NAME" == *-playtest ]]; then flags=(--prerelease); latest=false; fi
          gh release create "$GITHUB_REF_NAME" release-output/* --draft --verify-tag "${flags[@]}" --repo "$GITHUB_REPOSITORY" --title "Grimhollow ${GITHUB_REF_NAME}" --notes-file release-output/release-notes.md
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest="$latest" --repo "$GITHUB_REPOSITORY"
