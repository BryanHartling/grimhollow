name: Grimhollow build and acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch immutable upstream restoration source
        run: git fetch https://github.com/00-Evan/shattered-pixel-dungeon.git refs/tags/v4.0.0:refs/tags/v4.0.0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
      - run: python -m pip install Pillow==12.3.0 numpy==2.3.5
      - name: Build desktop distribution
        shell: bash
        run: ./gradlew desktop:dist -PdesktopOnly=true --no-daemon --console=plain
      # Recovery supersedes generated-art tests 3/4/17/18/28-30/35/39-42.
      # Their implementations and historical evidence remain in the repository.
      # No artgen or Blender production/check loop runs for the restored assets.
      - name: Upstream pixel provenance (test 44)
        run: python tools/recovery_assets.py --check
      - name: JUnit tests including navigation policy
        if: ${{ !cancelled() }}
        shell: bash
        run: ./gradlew core:test -PdesktopOnly=true --no-daemon --console=plain
      - name: Compiled handlers and network call audit (test 46)
        if: ${{ !cancelled() }}
        shell: bash
        run: python tools/recovery_checks.py --jar "$(find desktop/build/libs -name 'desktop-*.jar' -print -quit)"
      - name: Remembered terrain, walking evidence, geometry, effects and menu handlers
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        shell: bash
        run: |
          regions=(sewers prison caves city halls)
          result=0
          for index in 0 1 2 3 4; do
            options=()
            if [ "$index" = 0 ]; then
              options=(-Dgrimhollow.geometryTests=true -Dgrimhollow.effectsTests=true)
            fi
            xvfb-run -a java -Dgrimhollow.recovery=true -Dgrimhollow.region=$index "${options[@]}" -jar "$(find desktop/build/libs -name 'desktop-*.jar' -print -quit)" --smoke-sewers || result=1
            python tools/recovery_checks.py --region "${regions[$index]}" || result=1
          done
          exit "$result"
      - name: Committed Windows room distinctness evidence (test 45)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: python tools/recovery_checks.py --all-regions
      - name: Vault boss arena and elemental forms in the existing renderer
        if: ${{ !cancelled() && runner.os == 'Linux' }}
        run: xvfb-run -a java -Dgrimhollow.vault=true -jar "$(find desktop/build/libs -name 'desktop-*.jar' -print -quit)" --smoke-sewers
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: grimhollow-recovery-evidence-${{ matrix.os }}
          path: verification/recovery/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: grimhollow-desktop-${{ matrix.os }}
          path: desktop/build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: ./gradlew android:assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: grimhollow-android-debug
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
  headless-smoke:
    runs-on: ubuntu-latest
    needs: desktop
    if: ${{ !cancelled() }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Three classes, ten seeds each, through floor 6
        run: ./gradlew core:smokeRun -PdesktopOnly=true --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grimhollow-headless-logs
          path: core/build/reports/smoke/
          retention-days: 14

  necromancer-smoke:
    runs-on: ubuntu-latest
    needs: desktop
    if: ${{ !cancelled() }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Necromancer, ten seeds, class features and floor 6
        run: ./gradlew core:smokeRun -PsmokeClass=NECROMANCER -PdesktopOnly=true --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grimhollow-necromancer-logs
          path: core/build/reports/smoke/
          retention-days: 14

  enchanter-smoke:
    runs-on: ubuntu-latest
    needs: desktop
    if: ${{ !cancelled() }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Enchanter, ten seeds, class features and floor 6
        run: ./gradlew core:smokeRun -PsmokeClass=ENCHANTER -PdesktopOnly=true --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grimhollow-enchanter-logs
          path: core/build/reports/smoke/
          retention-days: 14

  psychic-smoke:
    runs-on: ubuntu-latest
    needs: desktop
    if: ${{ !cancelled() }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Psychic, ten seeds, class features and floor 6
        run: ./gradlew core:smokeRun -PsmokeClass=PSYCHIC -PdesktopOnly=true --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grimhollow-psychic-logs
          path: core/build/reports/smoke/
          retention-days: 14
