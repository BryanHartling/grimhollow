balancetuning.density=Enemy population
balancetuning.density_desc=Regular-floor starting enemies and respawn population cap. 200% doubles them; 0% removes regular spawns. Bosses and special-room residents stay. New floors use the starting count.
balancetuning.respawn=Respawn speed
balancetuning.respawn_desc=400% means four times as often; 0% disables timed respawns. Applies when the respawner next acts. Does not summon or remove enemies immediately.
balancetuning.rare_mobs=Rare enemy rate
balancetuning.rare_mobs_desc=Multiplies rare regional visitors and exotic replacements, such as albino rats. Baseline exotic chance is 2%, before trinkets. Applies to new spawn rotations.
balancetuning.cursebound=Curse-bound chance
balancetuning.cursebound_desc=Percent of eligible future monsters that become curse-bound. 0% disables new variants. Existing variants keep their curse.
balancetuning.curse_health=Curse-bound bonus HP
balancetuning.curse_health_desc=Percent extra health granted when a monster becomes curse-bound. 30% means 130% of normal health. Existing health is not recalculated.
balancetuning.curse_loot=Curse-bound bonus loot
balancetuning.curse_loot_desc=Percent chance for the separate extra item when a curse-bound enemy dies. Its ordinary loot roll is separate. Applies to future deaths, including existing variants.
balancetuning.hexcaster=Hexcaster chance
balancetuning.hexcaster_desc=Percent chance to add one Hexcaster to each fresh monster rotation on floors 11-20. This is not the percentage of all enemies.
balancetuning.chainwarden=Chainwarden chance
balancetuning.chainwarden_desc=Percent chance for Chainwarden instead of Tengu when floor 10 is generated. Existing bosses stay; use a new or rebuilt floor to reroll.
balancetuning.floor_loot=Random floor loot
balancetuning.floor_loot_desc=Multiplier for the 3-5 random items on a regular floor. New or rebuilt floors only. Guaranteed food, strength/upgrade supplies, keys, special rooms and quests stay.
balancetuning.mob_loot=Enemy loot chance
balancetuning.mob_loot_desc=Multiplier for ordinary enemy loot chance, capped naturally at one successful roll. Level limits and stolen-item rules remain. Wealth, Lucky and quest rewards stay separate.
balancetuning.tier_shift=Equipment tier shift
balancetuning.tier_shift_desc=Adds -2 to +2 to the rolled weapon, thrown weapon and armor tier, clamped to tiers 1-5. Applies to future depth-based generator rolls, not upgrades or existing gear.
balancetuning.upgrades=Pre-upgraded gear rate
balancetuning.upgrades_desc=Multiplier for the initial +1-or-better roll on randomized weapons, armor, wands and rings. The conditional +2 chance stays 20%. Does not add upgrades to carried gear.
balancetuning.cursed_gear=Cursed gear rate
balancetuning.cursed_gear_desc=Multiplier for curse chance on randomized weapons, armor, wands and rings (normally 30%). Artifact curses and scripted rewards stay unchanged. Curse rolls take priority over enchantments.
balancetuning.enchanted_gear=Enchanted gear rate
balancetuning.enchanted_gear_desc=Multiplier for beneficial enchantment/glyph chance on randomized weapons and armor (normally 10%/15%). Curse rolls take priority. Does not change combat proc rates.
balancetuning.rare_enchant=Rare enchantment weight
balancetuning.rare_enchant_desc=Multiplier for the rare tier weight in random beneficial enchantment/glyph selection. Applies to random enchanting too. 0% excludes rare-tier rolls; effects and proc rates stay.
balancetuning.bone_armor=Bone Armor substitution
balancetuning.bone_armor_desc=Percent chance to replace generated Mail Armor with Bone Armor, after the tier roll. Applies only to future random armor.
balancetuning.weapon=Melee weapons
balancetuning.weapon_desc=Relative weight in general random loot. Explicit category rewards and guaranteed supplies bypass this control. 100% keeps the normal relative weight; 0% excludes this category from general draws.
balancetuning.armor=Armor
balancetuning.armor_desc=Relative weight in general random loot. Explicit category rewards and guaranteed supplies bypass this control. 100% keeps the normal relative weight; 0% excludes this category from general draws.
balancetuning.missile=Thrown weapons
balancetuning.missile_desc=Relative weight in general random loot. Explicit category rewards and guaranteed supplies bypass this control. 100% keeps the normal relative weight; 0% excludes this category from general draws.
balancetuning.wand=Wands
balancetuning.wand_desc=Relative weight in general random loot. Explicit category rewards and guaranteed supplies bypass this control. 100% keeps the normal relative weight; 0% excludes this category from general draws.
balancetuning.ring=Rings
balancetuning.ring_desc=Relative weight in general random loot. Explicit category rewards and guaranteed supplies bypass this control. 100% keeps the normal relative weight; 0% excludes this category from general draws.
balancetuning.artifact=Artifacts
balancetuning.artifact_desc=Relative weight in general random loot. Explicit category rewards and guaranteed supplies bypass this control. After unique artifacts run out, their rolls give rings as usual.
balancetuning.potion=Potions
balancetuning.potion_desc=Relative weight in general random loot. Explicit category rewards and guaranteed supplies bypass this control. 100% keeps the normal relative weight; 0% excludes this category from general draws.
balancetuning.scroll=Scrolls
balancetuning.scroll_desc=Relative weight in general random loot. Explicit category rewards and guaranteed supplies bypass this control. 100% keeps the normal relative weight; 0% excludes this category from general draws.
balancetuning.seed=Seeds
balancetuning.seed_desc=Relative weight in general random loot. Explicit category rewards and guaranteed supplies bypass this control. 100% keeps the normal relative weight; 0% excludes this category from general draws.
balancetuning.stone=Runestones
balancetuning.stone_desc=Relative weight in general random loot. Explicit category rewards and guaranteed supplies bypass this control. 100% keeps the normal relative weight; 0% excludes this category from general draws.
balancetuning.gold=Gold
balancetuning.gold_desc=Relative weight in general random loot. Explicit category rewards and guaranteed supplies bypass this control. 100% keeps the normal relative weight; 0% excludes this category from general draws.


balancetuning.expedition_chance=Expedition offer chance
balancetuning.expedition_chance_desc=Chance that a new run offers the treasure hunter on one City floor, 16–19. Seeded independently of normal dungeon generation. Changes need a not-yet-generated hunter floor; an accepted expedition remains accessible.
balancetuning.dragon_health=Dragon health
balancetuning.dragon_health_desc=Maximum and starting HP of a newly created dragon. Existing saved wounds and maximum HP stay; this cannot heal or reset a dragon.
balancetuning.dragon_damage=Dragon impact damage
balancetuning.dragon_damage_desc=Multiplier for claw, direct breath and wingbeat impact damage. Lingering burning and fire terrain retain their usual rules.
balancetuning.dragon_breath_cooldown=Breath cooldown turns
balancetuning.dragon_breath_cooldown_desc=Minimum turns between breaths, including their windup. Three is the permitted minimum. Applies when the next breath resolves; an existing cooldown finishes normally.
balancetuning.dragon_knockback=Wingbeat push cells
balancetuning.dragon_knockback_desc=Maximum cells thrown by the next wingbeat, stopping at obstructions or the first fall edge. Zero disables displacement; impact damage is separate.
balancetuning.cavern_sight=Cavern base sight
balancetuning.cavern_sight_desc=Base vision radius on entering or generating the lower cavern. Torches, spells and the Ashlight Lantern still work normally. No fixed light sources are added.
balancetuning.expedition_fall_damage=Expedition fall damage
balancetuning.expedition_fall_damage_desc=Percent of maximum hero HP lost when falling from the platforms. Standard Cripple still applies; feather fall still prevents the landing injury. Climbing down voluntarily causes no damage.
balancetuning.brood_health=Broodmother health
balancetuning.brood_health_desc=Starting and maximum HP for a newly generated broodmother. Existing bosses are not healed or replaced.
balancetuning.brood_damage=Broodmother bite damage
balancetuning.brood_damage_desc=Multiplier for the broodmother bite. Poison duration is controlled separately.
balancetuning.brood_poison=Bite poison turns
balancetuning.brood_poison_desc=Poison duration applied by the broodmother bite. Zero disables new poison applications; existing poison expires normally.
balancetuning.spiders_initial=Initial cave spinners
balancetuning.spiders_initial_desc=Initial scavengers on a newly generated cavern, capped by the overall spider limit. These have ordinary loot and experience.
balancetuning.brood_live=Live hatchling limit
balancetuning.brood_live_desc=Maximum living summoned hatchlings. Lowering the limit prevents further hatching; it does not delete creatures already present.
balancetuning.brood_total=Lifetime hatchling budget
balancetuning.brood_total_desc=Maximum summons in the entire encounter, across saves and visits. Already spent summons count toward this limit. Hatchlings grant no loot or experience.
balancetuning.spiders_cap=Overall spider limit
balancetuning.spiders_cap_desc=Cap on initial scavengers plus live hatchlings; the broodmother itself is excluded. Existing spiders are not removed when lowering this limit.
balancetuning.brood_interval=Brood hatch interval
balancetuning.brood_interval_desc=Engaged actions before a new hatch warning, followed by its one-turn windup. Changes apply after the current hatch resolves.
balancetuning.cavern_rations=Guaranteed rations
balancetuning.cavern_rations_desc=Rations among the finite remains of a newly generated cavern. No supplies regenerate on return.
balancetuning.cavern_torches=Guaranteed torches
balancetuning.cavern_torches_desc=Torches among the finite remains of a newly generated cavern. Other finds follow the Cavern remains loot controls.
balancetuning.hoard_gold=Hoard gold center
balancetuning.hoard_gold_desc=Gold reward is randomly 80–120% of this amount. Zero removes the gold reward. Applies only before the one-time hoard unlock.
balancetuning.hoard_equipment=Hoard equipment count
balancetuning.hoard_equipment_desc=Number of exceptional weapon, armor, ring or wand rewards. Each is identified and uncursed. Challenge-blocked draws fall back to gold after bounded retries.
balancetuning.hoard_upgrades=Hoard minimum upgrade
balancetuning.hoard_upgrades_desc=Each equipment reward gets this upgrade level or one higher, capped at +10. Applies to future hoard unlocks, never to existing items.
balancetuning.hoard_artifact=Bonus artifact chance
balancetuning.hoard_artifact_desc=Independent chance of one uncursed +5 artifact, respecting unique-artifact exhaustion and challenge exclusions. No duplicate artifact is forced.
balancetuning.hoard_trinket=Second trinket chance
balancetuning.hoard_trinket_desc=Independent chance of a random +0 trinket different from any carried type. Both carried trinkets apply their native effects. No replacement Catalyst is created.

balancetuning.cavern_remains=Cavern remains count
balancetuning.cavern_remains_desc=Number of finite bone piles and adventurer remains on a new or rebuilt cavern. Half use each appearance. Guaranteed rations and torches are included. Default 48 leaves much more equipment than one backpack can carry.

balancetuning.cavern_gear_weight=Common equipment weight
balancetuning.cavern_gear_weight_desc=Relative share of melee weapons, armor and thrown weapons in non-supply remains. Default 80 gives about four fifths equipment. Existing category weights for ordinary dungeon loot do not change this separate cache.

balancetuning.cavern_ring_weight=Ring weight
balancetuning.cavern_ring_weight_desc=Relative share of occasional rings among non-supply remains. Default 5. Zero excludes rings.

balancetuning.cavern_gold_weight=Gold weight
balancetuning.cavern_gold_weight_desc=Relative share of small 15-40 gold finds among non-supply remains. Default 10.

balancetuning.cavern_consumable_weight=Consumables weight
balancetuning.cavern_consumable_weight_desc=Relative share of seeds, runestones, potions and scrolls among non-supply remains. Default 5. At least one of the four loot weights must be positive.

balancetuning.cavern_max_tier=Remains equipment tier ceiling
balancetuning.cavern_max_tier_desc=Highest equipment tier in this cache, 1-5. Default 3 favors tier 2-3 with some tier 1; basic salvage, below the hoard quality. Does not affect rings.

balancetuning.cavern_upgrades=Remains upgrade level
balancetuning.cavern_upgrades_desc=Upgrade level for equipment and rings in new remains, 0-3. Default 0. Separate from the dragon hoard rewards; curses and enchantments follow ordinary item generation.

balancetuning.horror_chance=Horror regional chance
balancetuning.horror_chance_desc=One seeded roll per region, never floor 1, bosses or side quests. Default 50%: about two or three per run. Requires a newly generated selected floor with an empty ordinary room.
balancetuning.horror_damage=Horror damage
balancetuning.horror_damage_desc=Scales ordinary and warned ambush damage together. A full reveal cancels the ambush advantage.
balancetuning.horror_evasion=Horror evasion
balancetuning.horror_evasion_desc=Scales regional evasion for newly spawned Horrors. Baseline 8/10/12/14/16.
balancetuning.horror_flight=Horror flight duration
balancetuning.horror_flight_desc=Scales 15/12/10/8/6 elapsed turns of exposed retreat. Movement speed remains 1.5x.
balancetuning.horror_healing=Horror lifetime healing
balancetuning.horror_healing_desc=Total healing budget as a percentage of maximum HP, capped at 25%. It never refreshes when the creature hides again.

balancetuning.cache_chance=Elemental encounter chance multiplier
balancetuning.cache_chance_desc=Scales independent regional rolls for elemental rooms. Default 100%; 0 disables future encounters. Each type appears at most once per run, separate from ordinary secret rooms. Defaults average about 1.7 across a complete run.
balancetuning.cache_fire_chance=Fire starting regional chance
balancetuning.cache_fire_chance_desc=Base percent for the Sewers; multiplies by region number 1-5. Default 6 gives 6/12/18/24/30%. One seeded roll and eligible floor per region until encountered. Zero disables this type.
balancetuning.cache_water_chance=Water starting regional chance
balancetuning.cache_water_chance_desc=Base percent for the Sewers; multiplies by region number 1-5. Default 5 gives 5/10/15/20/25%. One seeded roll and eligible floor per region until encountered. Zero disables this type.
balancetuning.cache_lightning_chance=Lightning starting regional chance
balancetuning.cache_lightning_chance_desc=Base percent for the Sewers; multiplies by region number 1-5. Default 4 gives 4/8/12/16/20%. One seeded roll and eligible floor per region until encountered. Zero disables this type.
balancetuning.cache_loot=Treasury loot quantity
balancetuning.cache_loot_desc=Gold piles and chest count multiplier for new rooms. Default 100%. Zero produces an empty treasury. Gold, equipment tiers, upgrades and chest counts improve with region depth.
balancetuning.cache_fire_key=Fire seal bypass charges
balancetuning.cache_fire_key_desc=Skeleton Key charges needed to bypass a discovered fire seal. Default 4. Ordinary keys never work.
balancetuning.cache_water_key=Water seal bypass charges
balancetuning.cache_water_key_desc=Skeleton Key charges needed to bypass a discovered water seal. Default 5. Stored when the room is generated.
balancetuning.cache_lightning_key=Lightning seal bypass charges
balancetuning.cache_lightning_key_desc=Skeleton Key charges needed to bypass a discovered lightning seal. Default 6. Stored when the room is generated.

balancetuning.coin_heads=Heads chance at +0
balancetuning.coin_heads_desc=Starting percent chance of Heads at +0; each level adds three percentage points.
balancetuning.coin_zero_expiry=Level-zero expiry turns
balancetuning.coin_zero_expiry_desc=Game turns available for the single eligible roll after a level-zero flip.
balancetuning.coin_charge_turns=Turns per coin charge
balancetuning.coin_charge_turns_desc=Equipped turns per charge. Artifact recharge bonuses apply.
balancetuning.coin_gold_charge=Gold per coin charge
balancetuning.coin_gold_charge_desc=Newly earned gold per charge. Recovered or re-dropped gold never counts.
balancetuning.coin_gold=Gold-find strength
balancetuning.coin_gold_desc=Percent multiplier for the gold-find passive and Plunder gold bonus.
balancetuning.coin_quality=Loot-quality strength
balancetuning.coin_quality_desc=Percent multiplier for the chance to compare legal equipment rolls.
balancetuning.coin_weighted=Weighted Odds strength
balancetuning.coin_weighted_desc=Percent multiplier for the level 5-10 chance to use normal maximum hero damage.
balancetuning.coin_theft_resist=Equipped theft resistance
balancetuning.coin_theft_resist_desc=Percent chance to resist equipped coin theft. Active luck prevents theft.
balancetuning.coin_room=Extra treasury chance
balancetuning.coin_room_desc=Percent chance of one extra treasure room on a new main-dungeon floor at +10.
balancetuning.coin_cache=Elemental chance bonus
balancetuning.coin_cache_desc=Percentage points added to remaining elemental cache types at +10 when first generating a region. Plans are then frozen. One of each per run remains absolute.
balancetuning.coin_shop_rolls=Special shop candidates
balancetuning.coin_shop_rolls_desc=Candidates for the single special shop stock slot at +10.
balancetuning.companion_health=Guardian health
balancetuning.companion_health_desc=Percent multiplier for companion health.
balancetuning.companion_damage=Guardian damage
balancetuning.companion_damage_desc=Percent multiplier for companion damage.
balancetuning.companion_steal=Gold-bite chance
balancetuning.companion_steal_desc=Percent chance on a successful bite, replacing damage. One success per eligible enemy.
balancetuning.companion_gold=Gold-bite amount
balancetuning.companion_gold_desc=Percent multiplier for finite stolen gold per enemy.
balancetuning.companion_root=Rooting turns
balancetuning.companion_root_desc=Turns of roots against non-bosses; zero disables.
balancetuning.companion_root_cooldown=Rooting cooldown
balancetuning.companion_root_cooldown_desc=Game turns between rooting bites.
balancetuning.companion_recovery=Recovery turns
balancetuning.companion_recovery_desc=Turns after incapacitation before entry to a different floor restores the companion. Revisits count.
balancetuning.companion_collect=Gold-gathering radius
balancetuning.companion_collect_desc=Radius from hero for visible safe loose gold collection; zero disables.

balancetuning.chart_chance_0=Chart discovery at +0
balancetuning.chart_chance_0_desc=Percent chance on the first eligible ordinary-floor entry while carried. Never rerolls on revisits.
balancetuning.chart_chance_1=Chart discovery at +1
balancetuning.chart_chance_1_desc=Percent chance on first eligible ordinary-floor entry. One ordinary reward per region.
balancetuning.chart_chance_2=Chart discovery at +2
balancetuning.chart_chance_2_desc=Percent chance on first eligible ordinary-floor entry. Mapping can settle a failed promise.
balancetuning.chart_chance_3=Chart discovery at +3
balancetuning.chart_chance_3_desc=Percent chance on first eligible ordinary-floor entry. No odds bonus from Doubloon.
balancetuning.chart_gold=Chart treasure gold
balancetuning.chart_gold_desc=Multiplier on depth-scaled gold. Normal gold pickup bonuses still apply.
balancetuning.chart_items_0=Chart items at +0
balancetuning.chart_items_0_desc=Items besides gold. At least one equipment and one useful consumable.
balancetuning.chart_items_1=Chart items at +1
balancetuning.chart_items_1_desc=Items besides gold. Unique, quest and class-specific starter pieces are excluded.
balancetuning.chart_items_2=Chart items at +2
balancetuning.chart_items_2_desc=Items besides gold. Equipment receives improved-quality comparisons.
balancetuning.chart_items_3=Chart items at +3
balancetuning.chart_items_3_desc=Items besides gold. Depth restrictions and region limits remain.
balancetuning.chart_quality_rolls=Chart equipment quality rolls
balancetuning.chart_quality_rolls_desc=Number of legal same-subtype comparisons at +2/+3 and for the dragon pocket. Prefer uncursed, permanent upgrades, then a positive modifier. The dragon pocket is uncursed and has a rank-scaled minimum upgrade.
balancetuning.chart_memory_cells=Maximum faded room size
balancetuning.chart_memory_cells_desc=Maximum explored interior cells forgotten per claimed treasure. Each claim costs one room anywhere already explored in that region. Earlier losses persist until revisited or mapped. Visible cells, nearby cells, doors, stairs, known traps and journal terrain remain protected.
notes$landmark.cole=Cole's office
badges$badge.coles_folly.title=Cole's Folly
badges$badge.coles_folly.desc=He came to collect. He miscalculated.
badges$badge.bounty_negotiated.title=The Negotiated Settlement
badges$badge.bounty_negotiated.desc=The contract was called off. Professionally.
badges$badge.bounty_professional.title=The Professional
badges$badge.bounty_professional.desc=Cole called it off himself. He said mostly.
badges$badge.wanted.title=Wanted
badges$badge.wanted.desc=You outlasted the contract. Cole hasn't filed the paperwork yet.
balancetuning.cole_price=Cole price multiplier
balancetuning.cole_price_desc=Future shop and settlement quotes as a percent of standard regional shop price. Saved quotes do not change.
balancetuning.bounty_common_pay=Common bounty payment
balancetuning.bounty_common_pay_desc=Gold for future Common contract plans. Accepted and already planned contracts retain their payment.
balancetuning.bounty_rare_pay=Rare / Legendary bounty payment
balancetuning.bounty_rare_pay_desc=Equal cash rewards for future Rare and Legendary contracts. The Legendary still drops its coat and has no urgency bonus. Existing contract quotes are retained.
balancetuning.bounty_boss_pay=Boss bounty payment
balancetuning.bounty_boss_pay_desc=Gold for future boss contracts. Existing boss offers retain their payment.
balancetuning.bounty_deadline=Urgency window
balancetuning.bounty_deadline_desc=Elapsed turns available for future Common/Rare contract bonuses. Accepted contracts keep their saved deadline.
balancetuning.bounty_bonus=Urgency payment bonus
balancetuning.bounty_bonus_desc=Percent extra payment for timely future Common/Rare contracts. Existing contracts keep their saved bonus.
balancetuning.wanted_common_hp=Common wanted health
balancetuning.wanted_common_hp_desc=Percent of the base creature's health for future wanted spawns; existing targets keep their health.
balancetuning.wanted_rare_hp=Rare wanted health
balancetuning.wanted_rare_hp_desc=Percent of the base creature's health for future wanted spawns; existing targets keep their health.
balancetuning.wanted_legend_hp=Legendary wanted health
balancetuning.wanted_legend_hp_desc=Percent of the base creature's health for future wanted spawns; existing targets keep their health.
balancetuning.wanted_common_damage=Common wanted damage
balancetuning.wanted_common_damage_desc=Percent of ordinary damage for future wanted spawns. Spawned targets retain their multiplier.
balancetuning.wanted_rare_damage=Rare wanted damage
balancetuning.wanted_rare_damage_desc=Percent of ordinary damage for future wanted spawns. Spawned targets retain their multiplier.
balancetuning.wanted_legend_damage=Legendary wanted damage
balancetuning.wanted_legend_damage_desc=Percent of ordinary damage for future wanted spawns. Spawned targets retain their multiplier.
balancetuning.wanted_armor=Wanted armor trait
balancetuning.wanted_armor_desc=Additional rolled armor reduction for newly spawned wanted creatures with the armored trait.
balancetuning.wanted_movement=Wanted movement trait
balancetuning.wanted_movement_desc=Movement percent for newly spawned wanted creatures with the nimble trait.
balancetuning.crew_health=Hunter crew health
balancetuning.crew_health_desc=Health percent for future regional hunters. Existing hunters keep health and finite supplies. Crew count stays fixed.
balancetuning.crew_damage=Hunter crew damage
balancetuning.crew_damage_desc=Damage percent for future regional hunters. Existing hunters keep their multiplier.
balancetuning.cole_health=Cole combat health
balancetuning.cole_health_desc=Health percent relative to an ordinary melee mob in the deepest region reached. Applied when Cole's fight first starts.
balancetuning.cole_damage=Cole combat damage
balancetuning.cole_damage_desc=Regional damage percent when Cole's fight first starts. Existing encounters retain damage.
balancetuning.cole_evasion=Cole combat evasion
balancetuning.cole_evasion_desc=Regional evasion percent when Cole's fight first starts. Existing encounters retain evasion.
balancetuning.cole_bolas=Cole Bolas ammunition
balancetuning.cole_bolas_desc=Unupgraded Bolas supplied once when Cole's fight starts. Reloads and revisits never replenish ammunition.
balancetuning.brand_turns=Bloodmark duration
balancetuning.brand_turns_desc=Turns of Bloodmark on future Brand hits. Existing buffs keep their remaining duration.
balancetuning.brand_accuracy=Bloodmark weapon accuracy
balancetuning.brand_accuracy_desc=Hero weapon accuracy percent against a Bloodmarked target. Applies immediately; allied attacks and wands are excluded.
balancetuning.brand_penetration=Bloodmark physical penetration
balancetuning.brand_penetration_desc=Percent of rolled armor reduction bypassed by hero weapon attacks. Applies immediately; terrain and projectile collision stay intact.
balancetuning.coat_growth=Warden's Coat armor growth
balancetuning.coat_growth_desc=Extra maximum armor reduction per intrinsic upgrade above +2. Applies immediately to the coat, including converted class armor.
balancetuning.coat_first_hit=Warden's Coat first-hit scaling
balancetuning.coat_first_hit_desc=Percent reduction per intrinsic upgrade on each enemy's first qualifying hit. Applies immediately, capped at 100%; saved enemy receipts remain consumed.
