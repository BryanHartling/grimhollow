journal.document.adventurers_guide.title=Il Tomo sulla Padronanza del Dungeon
journal.document.adventurers_guide.intro.title=Introduzione
journal.document.adventurers_guide.intro.body=Salve Avventuriero, stai leggendo il Tomo sulla Padronanza del Dungeon. Questa guida è utilizzata come fonte di riferimento, e ti farà sapere magicamente il momento migliore per leggere ciascuna pagina.\n\n(Quando l'icona del diario appare, selezionala per leggere che cosa la guida ha da dirti! Sembra però che alcune pagine siano state strappate dal libro, non è che magari le potrai trovare nel dungeon?)
journal.document.adventurers_guide.examining.title=Esaminare
journal.document.adventurers_guide.examining.body=È importante studiare i tuoi nemici e i dintorni piuttosto che avventarsi alla cieca! Prenditi l'abitudine di esaminare qualsiasi cosa nuova.\n\n(Puoi esaminare premendo il pulsante con la lente di ingrandimento e poi selezionando cosa vuoi esaminare. Puoi anche esaminare potenziamenti e penalità selezionandone le icone.)
journal.document.adventurers_guide.surprise_attacks.title=Attacchi a Sorpresa
journal.document.adventurers_guide.surprise_attacks.body=Gli attacchi a sorpresa colpiscono sempre il bersaglio, rendendoli specialmente utili contro nemici evasivi come serpenti e spettri.\n\nPuoi sorprendere i nemici subito dopo che hanno attraversato una porta mentre ti inseguono, o quando ti perdono di vista in qualunque caso.
journal.document.adventurers_guide.identifying.title=Identificare Oggetti
journal.document.adventurers_guide.identifying.body=Il colore delle pozioni e i simboli delle pergamene sono diversi in ciascun dungeon. L'equipaggiamento non identificato può essere migliorato o incantato se sei fortunato, oppure potrebbe essere maledetto!\n\nLe pergamene di identificazione, miglioramento, e rimuovi maledizione sono molto utili se vuoi ridurre il rischio di utilizzare equipaggiamento non identificato.\n\n(Puoi trovare una lista di tutti gli oggetti che hai identificato nella sezione catalogo del tuo giornale)
journal.document.adventurers_guide.food.title=Gestire la Fame
journal.document.adventurers_guide.food.body=Razionare in maniera efficiente è uno dei migliori metodi per aumentare le tue probabilità di sopravvivenza, non hai sempre bisogno di mangiare appena diventi affamato!\n\nQuando non stai morendo di fame rigenererai lentamente la vita, quindi se mangi a vita piena quella rigenerazione andrà sprecata!\n\nSe decidi quando mangiare in base alla tua vita, il tuo cibo durerà molto più a lungo.
journal.document.adventurers_guide.alchemy.title=Alchimia & Gingilli
journal.document.adventurers_guide.alchemy.body=Se non trovi che un oggetto consumabile sia utile, puoi usarlo come ingrediente per alchimia o trasformarlo in versatile energia alchemica. Inoltre energizzare pozioni e pergamene le identifica!\n\nI gingilli sono un tipo di equipaggiamento unico che vengono creati e migliorati usando l'alchimia. Sono creati con un catalizzatore di gingilli magico e un po' di energia alchemica.\n\n(Il primo calderone alchemico è al terzo o quarto piano del dungeon. Troverai anche pagine del libro di ricette alchemiche vicino questi calderoni.)
journal.document.adventurers_guide.dieing.title=Affrontare la Sconfitta
journal.document.adventurers_guide.dieing.body=Esplorare il dungeon è pericoloso e la maggior parte degli avventurieri eventualmente va incontro alla loro fine.\n\nLa fortuna aiuta, ma i migliori avventurieri usano tutti i mezzi a loro disposizione per migliorare le proprie possibilità di successo.\n\n(Non ti arrabbiare se muori spesso, questo gioco è difficile! Concentrati sull'imparare il gioco e migliorare gradualmente, non sul vincere immediatamente.)
journal.document.adventurers_guide.searching.title=Ricerca
journal.document.adventurers_guide.searching.body=I dungeon sono pieni di porte segrete e trappole che appaiono invisibili a prima vista. Puoi spendere del tempo e cercare accuratamente qualora sospetti che una porta o una trappola sia nascosta nelle vicinanze.\n\n(Puoi cercare in tutte le caselle attorno a te cliccando due volte il pulsante con la lente d'ingrandimento. Forse ci sono delle porte nascoste proprio vicino a dove hai trovato questa pagina!)
journal.document.adventurers_guide.strength.title=Forza
journal.document.adventurers_guide.strength.body=Non c'è tempo per allenarsi con le armi e armature che trovi nel dungeon, quindi dovrai utilizzare la forza bruta per usarli con efficacia.\n\nLe pozioni di forza e le pergamene di miglioramento sono il modo migliore per raggiungere il valore di forza richiesto per utilizzare l'equipaggiamento di livello più alto.\n\nÈ importante utilizzare eventualmente oggetti di livello alto, ma non ignorare l'equipaggiamento che puoi utilizzare subito.
journal.document.adventurers_guide.upgrades.title=Miglioramenti
journal.document.adventurers_guide.upgrades.body=Più a fondo vai in un dungeon, più è importante che utilizzi equipaggiamento di alto livello migliorato magicamente, ma ti servirà anche la forza per usarlo propriamente.\n\nBacchette, anelli e artefatti non hanno bisogno di forza, ma hanno un utilizzo limitato oppure aiutano in maniera meno diretta nel combattimento.\n\nFare buone scelte su quello che migliori è molto importante per sopravvivere agli inizi del dungeon, e per impostare il tuo successo più avanti nel dungeon.
journal.document.adventurers_guide.looting.title=Saccheggio Efficace
journal.document.adventurers_guide.looting.body=Le stanze che si trovano dietro le porte chiuse a chiave o che contengono ostacoli da superare, spesso hanno un bottino migliore. Quando un ostacolo blocca il tuo cammino, solitamente troverai un oggetto che ti possa aiutare nello stesso piano.\n\nTroverai sempre 2 pozioni di forza e 3 pergamene di miglioramento in ciascuna regione di cinque piani del dungeon, quindi sono un buon indicatore di quando bene stai esplorando.\n\n(Puoi vedere una lista di punti di interesse e di chiavi non utilizzate nella sezione delle note nella finestra del giornale.)
journal.document.adventurers_guide.levelling.title=Acquisire Esperienza
journal.document.adventurers_guide.levelling.body=Salire di livello aumenta le tue statistiche e ti ricompensa con punti talento, i quali possono fare una grossa differenza in combattimento. È meglio avere almeno un livello per piano del dungeon.\n\nPotresti avere la tentazione di andare di corsa e evitare l'esplorazione o il combattimento, ma fare ciò ti priva di risorse ed esperienza.\n\n(Puoi vedere le informazioni riguardo il tuo eroe, inclusa l'esperienza, sul pannello dello stato all'angolo dell'interfaccia di gioco. Seleziona il ritratto del tuo eroe per avere ulteriori informazioni.)
journal.document.adventurers_guide.positioning.title=Posizionamento
journal.document.adventurers_guide.positioning.body=La strategia è importante quanto l'equipaggiamento. Brutte situazioni come venire circondati spesso sono evitabili con un buon posizionamento.\n\nPer esempio, la maggior parte dei dungeon hanno stretti corridoi che costringono i nemici a combatterti uno per volta. Questi corridoi spesso hanno anche porte per effettuare attacchi a sorpresa!\n\nCi sono tantissimi piccoli modi di utilizzare le funzioni di ciò che ti circonda, come l'erba, l'acqua, i fossi, o anche le trappole a tuo vantaggio.
journal.document.adventurers_guide.magic.title=Attacchi Magici
journal.document.adventurers_guide.magic.body=Gli attacchi magici passano attraverso l'armatura e sono difficili da schivare. Questo significa che il danno dalle bacchette è molto affidabile, ma rende anche i nemici magici molto pericolosi!\n\nTuttavia, gli attacchi magici hanno sempre dei lati negativi. Le bacchette hanno cariche limitate, e i nemici magici non potranno usare la loro magia a distanza ravvicinata.\n\nAffrontando nemici che usano magia, è importante imparate come evitare che la usino su di te.

journal.document.alchemy_guide.title=Guida all'Alchimia
journal.document.alchemy_guide.potions.title=Introduzione e pozioni
journal.document.alchemy_guide.potions.body=Benvenuto alle Applicazioni Pratiche dell'Alchimia! Questo libro è un riferimento alle ricette per costruire oggetti ad un calderone alchemico.\n\nPartiremo con la ricetta più iconica: Pozioni!\n\nUtilizza tre semi per distillare una pozione casuale! Ogni seme ha una  corrispettiva pozione, utilizza più semi dello stesso tipo per aumentare la possibilità che la pozione sia la corrispettiva dei semi identici che hai utilizzato.
journal.document.alchemy_guide.stones.title=Creare Pietre Runiche
journal.document.alchemy_guide.stones.body=Una pergamena messa in un calderone alchemico instillerà la sua magia in due pietre che vi si trovano. Questo crea delle pietre runiche e identifica la pergamena!
journal.document.alchemy_guide.energy_food.title=Cibo ed Energia
journal.document.alchemy_guide.energy_food.body=Molte ricette richiedono cristalli di energia alchemica, che sono ottenuti scomponendo oggetti consumabili in un calderone alchemico. Energizzare pozioni e pergamene ne identifica il tipo.\n\nAlcune ricette che richiedono energia sono magiche, ma queste rappresentano la cucina tradizionale.
journal.document.alchemy_guide.exotic_potions.title=Pozioni Esotiche
journal.document.alchemy_guide.exotic_potions.body=Le pozioni possono essere mischiate con energia per creare pozioni esotiche. Queste ultime hanno effetti più potenti, ma di solito sono usate in modo diverso.
journal.document.alchemy_guide.exotic_scrolls.title=Pergamene Esotiche
journal.document.alchemy_guide.exotic_scrolls.body=Le pergamene esotiche possono essere fatte con pergamene ed energia. Sono un po' più potenti e più costose rispetto alle pozioni esotiche.
journal.document.alchemy_guide.bombs.title=Bombe Migliorate
journal.document.alchemy_guide.bombs.body=Una bomba di polvere nera standard può essere mescolata con un oggetto specifico per creare una bomba migliorata.
journal.document.alchemy_guide.weapons.title=Migliorare le armi
journal.document.alchemy_guide.weapons.body=Alcune delle armi più leggere o magiche si possono usare nell'alchimia!\n\nOgni set di armi da lancio produce abbastanza metallo liquido per riparare completamente un altro set dello stesso livello e categoria. Nota che alchimizzare un set distruggerà l'intero set, anche se non è tutto presente!\n\nUna bacchetta produce abbastanza resina arcana per migliorare due bacchette dello stesso livello, ma non oltre +3.
journal.document.alchemy_guide.brews_elixirs.title=Miscele ed Elisir
journal.document.alchemy_guide.brews_elixirs.body=Le miscele e gli elisir sono pozioni avanzate con una varietà di effetti, solitamente con un singolo utilizzo.
journal.document.alchemy_guide.spells.title=Formule Magiche
journal.document.alchemy_guide.spells.body=Le formule magiche sono contenute in cristalli e di solito procurano un assortimento di effetti con molteplici usi.

