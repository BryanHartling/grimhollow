journal.document.adventurers_guide.title=Abenteurer-Handbuch
journal.document.adventurers_guide.intro.title=Einführung
journal.document.adventurers_guide.intro.body=Sei gegrüßt, Abenteurer, du liest gerade das Abenteurer-Handbuch. Dieses Handbuch nutzt man am besten als Nachschlagewerk, und es zeigt dir auf magische Weise an, wann der beste Zeitpunkt ist, eine bestimmte Seite zu lesen.\n\n(Wenn das Buchsymbol oben rechts blinkt, wähle es an, um zu lesen, was dir das Handbuch zu sagen hat! Einige Seiten scheinen allerdings zu fehlen; vielleicht kannst du sie im Dungeon finden?)
journal.document.adventurers_guide.examining.title=Alles untersuchen!
journal.document.adventurers_guide.examining.body=Es ist wichtig, seine Gegner und die Umgebung zu studieren, statt sich einfach blind auf sie zu stürzen. Du solltest es dir angewöhnen, alles, was dir neu begegnet, zu untersuchen.\n\n(Du kannst etwas untersuchen, indem du auf die Lupentaste und dann auf den Gegenstand tippst, den du untersuchen möchtest. Du kannst auch Stärkungs- oder Schwächungseffekte untersuchen, indem du auf die entsprechenden Symbole tippst.)
journal.document.adventurers_guide.surprise_attacks.title=Überraschungsangriffe
journal.document.adventurers_guide.surprise_attacks.body=Überraschungsangriffe treffen garantiert, wodurch sie gegen wendige Feinde wie Schlangen und Gespenster besonders nützlich sind.\n\nDu kannst Feinde überraschen, wenn sie dich verfolgen und dabei eine Türöffnung betreten, oder wenn sie dich auf andere Weise aus der Sicht verlieren.
journal.document.adventurers_guide.identifying.title=Gegenstände identifizieren
journal.document.adventurers_guide.identifying.body=Die Farbe jedes Trankes und das Symbol jeder Schriftrolle sind in jedem Dungeon anders. Nicht identifizierte Ausrüstung kann aufgewertet oder verzaubert werden, wenn du Glück hast, sie könnte aber auch verflucht sein!\n\nSchriftrollen zur Identifizierung,  Aufwerten oder Entfernen von Flüchen sind sehr nützlich, wenn du das Risiko der Verwendung nicht identifizierter Ausrüstung verringern willst.\n\n(Eine Liste aller identifizierten Gegenstände findest du auf der Registerkarte Katalog in deinem Tagebuch.)
journal.document.adventurers_guide.food.title=Umgang mit Hunger
journal.document.adventurers_guide.food.body=Eine effektive Rationierung von Nahrung ist eines der besten Dinge, die du tun kannst, um deine Überlebenschancen zu verbessern. Du musst nicht immer gleich etwas essen, wenn du hungrig wirst!\n\nWenn du nicht gerade verhungerst, regeneriert sich deine Gesundheit allmählich. Wenn du also bei voller Gesundheit isst, wird diese Regeneration vergeudet!\n\nWenn du die Zeiten, in denen du etwas isst, an deiner Gesundheit ausrichtest, wird deine Nahrung viel länger ausreichen.
journal.document.adventurers_guide.alchemy.title=Alchemie & Kleinodien
journal.document.adventurers_guide.alchemy.body=Wenn du einen verbrauchbaren Gegenstand nicht besonders nützlich findest, kannst du ihn stattdessen als Zutat in einem Alchemiekessel verwenden oder in allseitig verwendbare alchemische Energie umwandeln. Durch die Umwandlung von Tränken oder Schriftrollen in Energie werden diese außerdem identifiziert!\n\nKleinodien sind eine besondere Art Ausrüstungsgegenstände, die man mittels Alchemie herstellen und verbessern kann. Sie werden aus einem magischen Katalysator und nur ein wenig alchemischer Energie hergestellt.\n\n(Du kannst den ersten Alchemiekessel auf Ebene 3 oder 4 des Dungeons finden. Es gibt in der Nähe des Kessels außerdem Seiten eines Buchs für Alchemierezepte.)
journal.document.adventurers_guide.dieing.title=Niederlagen einstecken
journal.document.adventurers_guide.dieing.body=Die Erkundung eines Dungeons ist ein gefährliches Unterfangen, und die meisten Abenteurer werden irgendwann ihr Ende finden.\n\nGlück spielt eine Rolle, aber die besten Abenteurer wenden jeden kleinen Trick an, um ihre Erfolgschancen zu verbessern.\n\n(Lass dich nicht entmutigen, wenn du oft stirbst; dieses Spiel ist schwer! Konzentriere dich darauf, das Spiel zu lernen und dich stetig zu verbessern, und nicht darauf, sofort zu gewinnen.)
journal.document.adventurers_guide.searching.title=Suche
journal.document.adventurers_guide.searching.body=Dungeons sind voll von Geheimtüren und Fallen, die auf den ersten Blick unsichtbar sind. Du kannst etwas Zeit investieren und gründlich suchen, wenn du vermutest, dass in der Nähe eine Tür oder eine Falle versteckt ist.\n\n(Du kannst alle Felder um dich herum durchsuchen, indem du doppelt auf die Lupentaste tippst. Vielleicht gibt es sogar verborgene Türen nahe der Stelle, an der du diese Seite gefunden hast!)
journal.document.adventurers_guide.strength.title=Stärke
journal.document.adventurers_guide.strength.body=Du hast keine Zeit, um mit den Waffen und Rüstungen, die du im Dungeon findest, zu trainieren, also brauchst du rohe Kraft, um sie effektiv einzusetzen.\n\nTränke der Stärke und Schriftrollen der Verbesserung sind der effektivste Weg, die Anforderungen für schwerere, höherwertige Ausrüstung zu erfüllen.\n\nEs ist wichtig, dass du auf die Möglichkeit der Nutzung hochrangiger Gegenstände hinarbeitest, aber du solltest die Ausrüstung, die du auch früher einsetzen kannst, nicht völlig ignorieren.
journal.document.adventurers_guide.upgrades.title=Verbesserungen
journal.document.adventurers_guide.upgrades.body=Je tiefer du in das Dungeon vordringst, desto wichtiger wird es, dass du magisch verbesserte Ausrüstung höherer Stufen verwendest; du brauchst aber auch die nötige Stärke, um sie richtig zu verwenden.\n\nZauberstäbe, Ringe und Artefakte benötigen keine Stärke, haben aber einen begrenzten Nutzen oder helfen nicht direkt im Kampf.\n\nEine gute Wahl bei der Aufrüstung ist sehr wichtig für das Überleben in den frühen Stadien, und ein Unterpfand für den Erfolg im späteren Verlauf des Dungeons.
journal.document.adventurers_guide.looting.title=Effektives Plündern
journal.document.adventurers_guide.looting.body=Räume hinter verschlossenen Türen oder anderen Hindernissen enthalten oft bessere Beute. Wann immer ein Hindernis deinen Weg versperrt, findest du in der Regel auf derselben Ebene einen Gegenstand, der dir weiterhilft.\n\nIn jeder Dungeon-Region aus fünf Ebenen kann man 2 Tränke der Stärke und 3 Schriftrollen der Verbesserung finden, das ist also ein gutes Zeichen dafür, wie gut du die Gegend erforschst.\n\n(Eine Liste wichtiger Orientierungspunkte und unbenutzter Schlüssel findest du auf der Registerkarte Notizen im Tagebuch.)
journal.document.adventurers_guide.levelling.title=Erfahrung sammeln
journal.document.adventurers_guide.levelling.body=Höhere Stufen erhöhen deine Statuswerte und bringen dir Talentpunkte, was zusammen im Kampf einen großen Unterschied ausmachen kann. Am besten ist es, für jede Ebene des Dungeons mindestens eine Erfahrungsstufe zu haben.\n\nEs kann verlockend sein, zu hetzen und dabei Erkundung oder Kampf zu vermeiden, aber dadurch gehen dir sowohl Vorräte als auch Erfahrung durch die Lappen.\n\n(Du kannst Informationen über deinen Helden, einschließlich der Erfahrung, in der Statusleiste oben auf der Spieloberfläche sehen. Tippe auf dein Heldenporträt, um noch mehr Informationen zu erhalten.)
journal.document.adventurers_guide.positioning.title=Positionierung
journal.document.adventurers_guide.positioning.body=Strategie ist ebenso wichtig wie Ausrüstung. Schlechte Situationen, wie z. B. das Umzingeln, lassen sich oft durch eine gute Positionierung vermeiden.\n\nDie meisten Dungeons haben zum Beispiel schmale Gänge, die Feinde dazu zu zwingen, einzeln gegen dich anzutreten. Diese Gänge haben oft auch Türen, die für Überraschungsangriffe genutzt werden können!\n\nEs gibt auch viele kleinere Möglichkeiten, Umgebungsmerkmale wie Gras, Wasser oder Fallen zu deinem Vorteil zu nutzen.
journal.document.adventurers_guide.magic.title=Magische Attacken
journal.document.adventurers_guide.magic.body=Magische Angriffe schneiden durch Rüstungen hindurch und man kann ihnen schwer auszuweichen. Das bedeutet, dass deine Zauberstäbe sehr zuverlässig Schaden verursachen, es macht magisch begabte Feinde aber auch sehr gefährlich!\n\nMagische Angriffe haben jedoch immer einen Nachteil. Bei Zauberstäben ist das ihre begrenzte Aufladung, und magisch begabte Feinde werden ihre Magie normalerweise nicht aus der nächsten Nähe einsetzen können.\n\nWenn du es mit magisch begabten Feinden zu tun bekommst, ist es wichtig herauszufinden, wie du sie davon abhältst, Magie gegen dich einzusetzen.

journal.document.alchemy_guide.title=Handbuch der Alchemie
journal.document.alchemy_guide.potions.title=Einleitung und Tränke
journal.document.alchemy_guide.potions.body=Willkommen zu den Praktischen Anwendungen der Alchemie! Dieses Buch ist ein Referenzwerk mit Rezepten, mithilfe derer man Gegenstände in einem Alchemiekessel herstellen kann.\n\nBeginnen wir mit dem kultigsten Alchemierezept: Tränke!\n\nPlatziere drei Samen im Alchemiekessel, um einen zufälligen Trank zu brauen! Zu jeder Art Samen gibt es einen entsprechenden Trank; nimm mehrere Samen der gleichen Art, dann ist es wahrscheinlicher, dass ein Trank dabei herauskommt, der dem von dir genutzten Samen entspricht.
journal.document.alchemy_guide.stones.title=Runensteine erschaffen
journal.document.alchemy_guide.stones.body=Wenn du eine Schriftrolle in einen Alchemiekessel gibst, wird ihre Magie in zwei Steine im Topf übertragen. Dadurch entstehen Runensteine und die Schriftrolle wird identifiziert.
journal.document.alchemy_guide.energy_food.title=Energie und Essen
journal.document.alchemy_guide.energy_food.body=Viele Rezepte erfordern alchemische Energiekristalle, welche bei der Zersetzung magischer Verbrauchsgegenstände in einem Alchemiekessel entstehen. Wenn man aus Tränken oder Schriftrollen zu Energie kristallisiert, identifiziert man diese dadurch auch.\n\nManche Rezepte, die Energie benötigen, sind magisch, aber diese hier erinnern eher an traditionelle Kochrezepte.
journal.document.alchemy_guide.exotic_potions.title=Exotische Tränke
journal.document.alchemy_guide.exotic_potions.body=Tränke können mit Energie gemischt werden, so dass exotische Tränke entstehen. Diese haben stärkere Effekte, doch sind sie oft auf ganz andere Weise nützlich.
journal.document.alchemy_guide.exotic_scrolls.title=Exotische Schriftrollen
journal.document.alchemy_guide.exotic_scrolls.body=Exotische Schriftrollen können mit etwas Energie und einer Schriftrolle erzeugt werden. Diese sind etwas stärker und teurer als exotische Tränke.
journal.document.alchemy_guide.bombs.title=Verbesserte Bomben
journal.document.alchemy_guide.bombs.body=Eine ganz normale Schwarzpulver-Bombe kann mit einem bestimmten Gegenstand verknüpft werden, um eine verbesserte Bombe herzustellen.
journal.document.alchemy_guide.weapons.title=Verbesserung von Waffen
journal.document.alchemy_guide.weapons.body=Manche der leichten oder magischen Waffen können alchemisch aufbereitet werden!\n\nJeder Satz Wurfwaffen produziert genug Flüssigmetall, um einen anderen Satz Wurfwaffen der gleichen Stufe und des gleichen Ranges vollständig zu reparieren. Die Alchimierung eines Satzes Wurfwaffen wird diesen Satz komplett zerstören, auch, wenn du gerade nicht alle Exemplare davon bei dir hast!\n\nEin Zauberstab produziert genug arkanes Harz, um zwei Zauberstäbe der gleichen Stufe zu verbessern, aber nicht höher als +3.
journal.document.alchemy_guide.brews_elixirs.title=Gebräue und Elixiere
journal.document.alchemy_guide.brews_elixirs.body=Gebräue und Elixiere sind fortgeschrittene Tränke mit einer Vielzahl von Effekten, üblicherweise für eine Anwendung.
journal.document.alchemy_guide.spells.title=Zaubersprüche
journal.document.alchemy_guide.spells.body=Zauber werden in Kristallen eingefangen und bieten eine Vielzahl von Effekten, üblicherweise für mehrere Anwendungen.

