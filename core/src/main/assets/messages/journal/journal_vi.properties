journal.document.adventurers_guide.title=Sách thành thạo hầm ngục
journal.document.adventurers_guide.intro.title=Phần giới thiệu
journal.document.adventurers_guide.intro.body=Xin chào nhà thám hiểm, bạn đang đọc cuốn Sách thành thạo hầm ngục. Cuốn sách hướng dẫn này tốt nhất nên được dùng để tham khảo, và bằng một cách thần kì sẽ cho bạn biết khi nào là tốt nhất để đọc mỗi trang.\n\n(Khi nút sổ tay nhấp nháy, chọn nó để đọc những gì cuốn sách hướng dẫn muốn nói với bạn! Nhưng một vài trang đang bị thiếu, có lẽ bạn có thể tìm thấy chúng trong hầm ngục?)
journal.document.adventurers_guide.examining.title=Xem xét
journal.document.adventurers_guide.examining.body=Một điều quan trọng là phải quan sát kẻ địch và môi trường xung quanh của bạn thay vì lao vào mà không suy nghĩ! Hãy tập thói quen xem xét tất cả những thứ mới lạ.\n\n(Bạn có thể xem xét bằng cách sử dụng nút kính lúp, rồi chọn thứ mà bạn muốn xem xét. Bạn cũng có thể xem xét các hiệu ứng có lợi hoặc có hại bằng cách nhấn chọn biểu tượng của chúng.)
journal.document.adventurers_guide.surprise_attacks.title=Tấn công bất ngờ
journal.document.adventurers_guide.surprise_attacks.body=Các đòn tấn công bất ngờ chắc chắn sẽ trúng, khiến chúng đặc biệt hữu dụng đối với những kẻ địch có khả năng né tránh cao như rắn và bóng ma.\n\nBạn có thể làm kẻ địch bất ngờ ngay sau khi chúng bước qua một cánh cửa trong khi đang đuổi bạn, hoặc khi chúng mất dấu bạn.
journal.document.adventurers_guide.identifying.title=Thẩm định vật phẩm
journal.document.adventurers_guide.identifying.body=Màu sắc của các lọ thuốc và biểu tượng trên các cuộn giấy ở trong mỗi hầm ngục là khác nhau. Trang bị chưa được thẩm định có thể đã được nâng cấp hoặc phù phép nếu bạn may mắn, hoặc nó có thể bị nguyền rủa!\n\nCác cuộn giấy thẩm định, nâng cấp hoặc xoá bỏ lời nguyền rất hữu ích nếu bạn muốn giảm thiểu rủi ro của việc sử dụng trang bị chưa được thẩm định.\n\n(Bạn có thể tìm thấy một danh sách các vật phẩm bạn đã thẩm định trong phần danh mục của sổ tay của bạn)
journal.document.adventurers_guide.food.title=Đối phó với cơn đói
journal.document.adventurers_guide.food.body=Phân chia khẩu phần thức ăn một cách hiệu quả là một trong những cách tốt nhất để cải thiện khả năng sinh tồn của bạn, không phải lúc nào bạn cũng cần phải ăn ngay khi thấy đói!\n\nKhi bạn không chết đói, bạn sẽ từ từ phục hồi sinh lực, vậy nên nếu bạn ăn ở mức sinh lực đầy, sự phục hồi đó sẽ bị lãng phí!\n\nNếu bạn ước tính thời điểm ăn dựa vào sinh lực của bạn, thức ăn của bạn sẽ lâu hết hơn nhiều.
journal.document.adventurers_guide.alchemy.title=Thuật giả kim & Phụ kiện
journal.document.adventurers_guide.alchemy.body=Nếu bạn thấy một vật phẩm tiêu thụ nào đó không hữu ích, bạn có thể sử dụng nó làm nguyên liệu cho thuật giả kim hoặc biến nó thành năng lượng giả kim đa năng. Năng lượng hóa các loại thuốc và cuộn giấy cũng sẽ thẩm định chúng! \n\nCác phụ kiện là một loại trang bị đặc biệt, được tạo ra và nâng cấp bằng cách sử dụng thuật giả kim. Chúng được tạo ra bằng một chất xúc tác cho phụ kiện phép thuật và một chút năng lượng giả kim.\n\n(Nồi giả kim đầu tiên nằm ở tầng thứ 3 hoặc thứ 4 của hầm ngục. Còn có các trang sách công thức giả kim gần những chiếc nồi này nữa.)
journal.document.adventurers_guide.dieing.title=Chấp nhận thất bại
journal.document.adventurers_guide.dieing.body=Thám hiểm hầm ngục là một việc nguy hiểm và hầu hết các nhà thám hiểm rồi cũng gặp phải cái chết của họ.\n\nVận may sẽ giúp ích, nhưng những nhà thám hiểm giỏi nhất sẽ sử dụng tất cả từng mẹo nhỏ để gia tăng cơ hội của họ.\n\n(Đừng cảm thấy không vui nếu bạn đang chết liên tục, trò chơi này khó đấy! Hãy tập trung vào việc tích luỹ kiến thức về trò chơi và tiến bộ dần dần, chứ không phải vào việc chiến thắng ngay lập tức.)
journal.document.adventurers_guide.searching.title=Tìm kiếm
journal.document.adventurers_guide.searching.body=Hầm ngục chứa đầy những cánh cửa và bẫy bí mật mà khi mới nhìn qua có vẻ như vô hình. Bạn có thể bỏ chút thời gian và cẩn thận tìm kiếm nếu bạn nghĩ rằng có một cánh cửa hoặc cái bẫy được ẩn giấu gần đó.\n\n(Bạn có thể tìm toàn bộ các ô xung quanh bạn bằng cách sử dụng nút kính lúp hai lần. Có khi có vài cánh cửa ẩn ở gần nơi bạn tìm thấy trang giấy này!)
journal.document.adventurers_guide.strength.title=Sức mạnh
journal.document.adventurers_guide.strength.body=Không có thời gian để luyện tập với các vũ khí và áo giáp bạn tìm thấy trong hầm ngục, vậy nên bạn sẽ cần sức mạnh thuần túy để sử dụng chúng hiệu quả.\n\nThuốc sức mạnh và cuộn giấy nâng cấp là những cách hiệu quả nhất để đạt được yêu cầu về sức mạnh của trang bị bậc cao.\n\nVề sau, chuyển sang sử dụng các vật phẩm bậc cao là điều quan trọng, nhưng đừng ngó lơ những trang bị bạn có thể sử dụng ngay bây giờ.
journal.document.adventurers_guide.upgrades.title=Nâng cấp
journal.document.adventurers_guide.upgrades.body=Càng đi sâu vào trong hầm ngục, việc sử dụng trang bị bậc cao được nâng cấp bằng phép thuật sẽ càng trở nên quan trọng hơn, nhưng bạn cũng sẽ cần có sức mạnh để sử dụng chúng đúng cách.\n\nĐũa phép, nhẫn và cổ vật không cần sức mạnh, nhưng chúng có giới hạn về sử dụng, hoặc khi chiến đấu sẽ không hỗ trợ trực tiếp bằng.\n\nĐưa ra lựa chọn thông minh về thứ bạn nâng cấp là điều rất quan trọng để sống sót vào giai đoạn đầu của hầm ngục, và cũng là nền tảng cho thành công về sau trong hầm ngục.
journal.document.adventurers_guide.looting.title=Thu lượm vật phẩm hiệu quả
journal.document.adventurers_guide.looting.body=Những căn phòng nằm sau các cánh cửa bị khoá hoặc chứa các trở ngại thường có vật phẩm tốt hơn.Khi có một trở ngại cản đường bạn, bạn thường có thể tìm thấy một vật phẩm sẽ giúp ích cho bạn ở cùng tầng đó.\n\nBạn sẽ luôn có thể tìm thấy 2 lọ thuốc sức mạnh và 3 cuộn giấy nâng cấp trong mỗi một khu vực hầm ngục gồm năm tầng, nên chúng là một thước đo tốt cho việc bạn đang khám phá giỏi đến đâu .\n\n(Bạn có thể xem một danh sách các điểm mốc và chìa khóa chưa sử dụng trong mục ghi chú của màn hình sổ tay.)
journal.document.adventurers_guide.levelling.title=Tích lũy kinh nghiệm
journal.document.adventurers_guide.levelling.body=Việc lên cấp sẽ gia tăng các chỉ số của bạn và trao điểm tài năng, những thứ có thể tạo ra sự khác biệt lớn trong chiến đấu. Tốt nhất là nên có ít nhất một cấp với mỗi tầng của hầm ngục. \n\nChạy vội vàng và tránh việc khám phá hoặc chiến đấu có thể là điều hấp dẫn, nhưng nếu làm như vậy bạn sẽ không có được các vật phẩm thiết yếu và kinh nghiệm.\n\n(Bạn có thể xem thông tin về người hùng của bạn, bao gồm cả kinh nghiệm, trên thanh trạng thái ở góc của giao diện trò chơi. Nhấn chọn vào chân dung người hùng của bạn để có được nhiều thông tin hơn nữa.)
journal.document.adventurers_guide.positioning.title=Chọn vị trí
journal.document.adventurers_guide.positioning.body=Chiến thuật cũng quan trọng ngang với trang bị. Những tình huống xấu như bị bao vây thường có thể tránh được bằng cách chọn vị trí tốt.\n\nVí dụ, hầu hết các hầm ngục đều có các hành lang hẹp, bắt kẻ địch phải chiến đấu với bạn từng tên một. Những hành lang này thường cũng có các cánh cửa cho các đòn tấn công bất ngờ!\n\nCũng có rất nhiều những cách nhỏ để tận dụng các yếu tố môi trường như cỏ, nước, hố hoặc bẫy theo cách có lợi cho bạn.
journal.document.adventurers_guide.magic.title=Đòn tấn công phép thuật
journal.document.adventurers_guide.magic.body=Các đòn tấn công phép thuật sẽ xuyên thẳng qua giáp và khó để né tránh. Điều này nghĩa là sát thương từ đũa phép rất đáng tin cậy, nhưng cũng khiến các kẻ địch phép thuật trở nên rất nguy hiểm!\n\nTuy vậy, các đòn tấn công phép thuật luôn có một hạn chế. Các đũa phép có năng lượng có hạn và kẻ địch phép thuật thường sẽ không thể sử dụng phép thuật của chúng trong tầm gần.\n\nKhi đối mặt với những kẻ địch sử dụng phép thuật, học cách ngăn chúng sử dụng nó lên bạn là điều quan trọng.

journal.document.alchemy_guide.title=Hướng dẫn giả kim
journal.document.alchemy_guide.potions.title=Mở đầu và thuốc
journal.document.alchemy_guide.potions.body=Chào mừng đến với Các ứng dụng thực tiễn của thuật giả kim! Cuốn sách này là một tài liệu về các công thức để chế tạo vật phẩm ở một nồi giả kim.\n\nChúng ta sẽ bắt đầu với công thức giả kim mang tính biểu tượng nhất: Thuốc!\n\nSử dụng ba hạt giống để nấu ra một lọ thuốc ngẫu nhiên! Mỗi hạt giống có một loại thuốc tương ứng, sử dụng nhiều hạt giống cùng loại để tăng khả năng lọ thuốc đó có liên hệ với những hạt giống bạn đã sử dụng.
journal.document.alchemy_guide.stones.title=Tạo ra đá rune
journal.document.alchemy_guide.stones.body=Trộn một cuộn giấy vào trong một nồi giả kim sẽ truyền phép thuật của nó vào trong hai hòn đá bên trong nồi. Việc này sẽ tạo ra đá rune và thẩm định cuộn giấy đó!
journal.document.alchemy_guide.energy_food.title=Năng lượng và thức ăn
journal.document.alchemy_guide.energy_food.body=Nhiều công thức cần tới tinh thể năng lượng giả kim, thứ được tạo ra bằng cách phân giải các vật phẩm tiêu thụ trong một nồi giả kim. Năng lượng hóa các loại thuốc hoặc cuộn giấy cũng sẽ thẩm định chúng.\n\nMột số những công thức cần tới năng lượng là những công thức phép thuật, nhưng các công thức này trông giống như các công thức nấu ăn truyền thống.
journal.document.alchemy_guide.exotic_potions.title=Thuốc lạ
journal.document.alchemy_guide.exotic_potions.body=Thuốc có thể được trộn với năng lượng để tạo ra thuốc lạ. Chúng có hiệu ứng mạnh hơn, nhưng thường hữu dụng theo các cách khác nhau.
journal.document.alchemy_guide.exotic_scrolls.title=Cuộn giấy lạ
journal.document.alchemy_guide.exotic_scrolls.body=Các cuộn giấy lạ có thể được ra bằng một ít năng lượng và một cuộn giấy. Chúng mạnh hơn một chút và đắt hơn so với các lọ thuốc lạ.
journal.document.alchemy_guide.bombs.title=Bom cường hóa
journal.document.alchemy_guide.bombs.body=Một quả bom thuốc súng thông thường có thể được trộn với một vật phẩm cụ thể để tạo ra một quả bom được cải tiến.
journal.document.alchemy_guide.weapons.title=Nâng cấp vũ khí
journal.document.alchemy_guide.weapons.body=Một số những vũ khí nhẹ hoặc phép thuật có thể được sử dụng trong thuật giả kim!\n\nMỗi bộ vũ khí ném tạo ra đủ kim loại lỏng để sửa chửa hoàn toàn một bộ khác có cùng cấp và bậc. Lưu ý rằng giả kim hoá một bộ sẽ phá huỷ cả bộ, ngay cả nếu không có đủ cả bộ ở đó!\n\nMột cây đũa phép sẽ tạo ra đủ nhựa cây ma thuật dể nâng cấp hai cây đũa phép có cùng cấp, nhưng không quá +3.
journal.document.alchemy_guide.brews_elixirs.title=Dung dịch và thần dược
journal.document.alchemy_guide.brews_elixirs.body=Dung dịch và thần dược là các loại thuốc cấp cao với đa dạng các hiệu ứng, thường là với một lần sử dụng.
journal.document.alchemy_guide.spells.title=Thần chú
journal.document.alchemy_guide.spells.body=Các thần chú được chứa trong pha lê và mang lại nhiều hiệu ứng đa dạng, thường với nhiều lần sử dụng.

journal.document.intros.title=Giới thiệu khu vực
journal.document.intros.discover_hint=Bạn có thể tìm thấy văn bản này khi bước vào một khu vực nhất định lần đầu tiên.
