journal.document.adventurers_guide.title=Księga "Jak przezwyciężyć lochy"
journal.document.adventurers_guide.intro.title=Wprowadzenie
journal.document.adventurers_guide.intro.body=Bądź pozdrowiony, poszukiwaczu przygód! Właśnie czytasz księgę "Jak przezwyciężyć lochy"! Poradnika tego najlepiej używać w razie potrzeby jako punktu odniesienia. Z pomocą magii automatycznie da on ci znać, kiedy najlepiej przeczytać daną stronę! \n\n(Gdy ikona dziennika w prawym górnym rogu ekranu migocze, oznacza to, że poradnik ma ci coś do przekazania! Wygląda na to, że kilka stron zostało wyrwanych, być może uda ci się znaleźć je gdzieś w lochu?)
journal.document.adventurers_guide.examining.title=Obserwowanie
journal.document.adventurers_guide.examining.body=Ważne jest, aby obserwować swoich przeciwników i otoczenie, zamiast szarżować na nich bezmyślnie! Wyrób nawyk, że sprawdzasz wszystko, co nowe.\n\n(Korzystając z przycisku z lupą i wybierając obiekt, możesz badać najróżniejsze cele. Możesz także zobaczyć opisy pozytywnych i negatywnych efektów, wybierając ich ikony.)
journal.document.adventurers_guide.surprise_attacks.title=Ataki z zaskoczenia
journal.document.adventurers_guide.surprise_attacks.body=Ataki z zaskoczenia zawsze trafiają, co jest szczególnie przydatne przeciwko trudnym do trafienia przeciwnikom, takim jak węże czy upiory.\n\nMożesz zaskoczyć wrogów, atakując ich, gdy właśnie otworzyli drzwi podczas pogoni za tobą lub w przypadku, gdy znikniesz im z oczu.
journal.document.adventurers_guide.identifying.title=Identyfikacja przedmiotów
journal.document.adventurers_guide.identifying.body=Kolory mikstur oraz symbole na zwojach będą inne dla każdego lochu. Przy odrobinie szczęścia, niezidentyfikowany rynsztunek może okazać się ulepszony lub zaklęty. Może też okazać się przeklęty!\n\nZwoje identyfikacji, ulepszenia lub zdjęcia klątwy są bardzo użyteczne, jeśli chcesz zmniejszyć ryzyko związane z użyciem niezidentyfikowanego przedmiotu.\n\n(Listę zidentyfikowanych obiektów możesz znaleźć w zakładce katalogu w swoim dzienniku)
journal.document.adventurers_guide.food.title=Postępowanie z głodem
journal.document.adventurers_guide.food.body=Odpowiedzialne racjonowanie żywności to jedna z najważniejszych rzeczy, które możesz zrobić, aby zwiększyć swoje szanse na przetrwanie. Nie musisz jeść od razu, gdy zgłodniejesz!\n\nKiedy nie jesteś wygłodzony, powoli regenerujesz zdrowie. Tak więc, jedząc przy pełnym zdrowiu, ta regeneracja zostanie zmarnowana!\n\nJeśli zdecydujesz, kiedy jesz, w zależności od stanu twojego zdrowia, żywność wystarczy ci na dużo dłużej.
journal.document.adventurers_guide.alchemy.title=Alchemia i Relikty
journal.document.adventurers_guide.alchemy.body=Jeśli uważasz jakiś przedmiot jednorazowego użytku za zbędny, możesz go użyć jako składnika w tyglu alchemicznym lub przekształcić w uniwersalną energię alchemiczną. Przekształcanie zwojów i mikstur w energię pozwala je zidentyfikować!\n\nRelikty są jedyną częścią ekwipunku, która jest tworzona i ulepszana z pomocą alchemii. Można je stworzyć z niewielkiej ilości energii alchemicznej i magicznego katalizatora. \n\n(Pierwszy tygiel alchemiczny znajdziesz na 3. lub 4. piętrze lochu. W pobliżu tych tygli znajdziesz strony z książki od alchemii.)
journal.document.adventurers_guide.dieing.title=Radzenie Sobie z Porażką
journal.document.adventurers_guide.dieing.body=Eksploracja podziemi to bardzo niebezpieczny zawód i większość poszukiwaczy przygód kończy tragicznie.\n\nOdrobina szczęścia pomaga, ale najlepsi poszukiwacze przygód korzystają z każdej sztuczki, aby zwiększyć swoje szanse.\n\n(Nie zniechęcaj się, jeśli często giniesz, ta gra jest trudna! Skoncentruj się na nauce gry i stopniowym doskonaleniu, a nie wygraniu od razu.)
journal.document.adventurers_guide.searching.title=Przeszukiwanie
journal.document.adventurers_guide.searching.body=Podziemia są pełne tajnych przejść i pułapek które są niewidoczne na pierwszy rzut oka. Możesz poświęcić trochę czasu na dokładniejsze poszukiwania, jeśli masz podejrzenie, że w pobliżu znajdują się ukryte drzwi lub pułapki.\n\n(Możesz przeszukać wszystkie pola wokół siebie, używając dwukrotnie przycisku z lupą. Być może w pobliżu miejsca, gdzie znaleziono tę stronę, są jakieś ukryte drzwi!)
journal.document.adventurers_guide.strength.title=Siła
journal.document.adventurers_guide.strength.body=W lochu nie ma czasu na trening z odnalezioną bronią czy pancerzem, więc aby ich efektywnie używać, potrzebny jest zastrzyk czystej siły.\n\nMikstury siły oraz zwoje ulepszenia są najlepszym remedium na spełnienie wymogów wyposażenia wyższego kręgu.\n\nWażną rzeczą jest dążenie do używania przedmiotów wyższych kręgów, lecz lepiej nie ignorować całkowicie wyposażenia, które możesz wykorzystać już teraz.
journal.document.adventurers_guide.upgrades.title=Ulepszenia
journal.document.adventurers_guide.upgrades.body=Im głębiej zapuszczasz się w loch, tym bardziej istotne jest używanie magicznie zaklętego wyposażenia wysokiego kręgu, które wymaga siły, aby móc je skutecznie używać.\n\nRóżdżki, pierścienie i artefakty nie wymagają siły, ale posiadają ograniczoną liczbę użyć, bądź są mało przydatne w bezpośrednim starciu.\n\nPodejmowanie właściwych decyzji w kwestii ulepszeń jest nad wyraz istotne dla przetrwania początkowych części lochu oraz odpowiedniego przygotowania na trudy głębszych poziomów.
journal.document.adventurers_guide.looting.title=Skutecznie łupienie
journal.document.adventurers_guide.looting.body=Pomieszczenia za zamkniętymi drzwiami lub zawierające przeszkody zazwyczaj zawierają lepsze łupy. Jeśli na twojej drodze stanie przeszkoda, powinieneś być w stanie znaleźć przedmiot niezbędny do uporania się z nią na tym samym piętrze.\n\nNa każdym pięciopiętrowym regionie lochu można znaleźć 2. mikstury siły i 3 zwoje ulepszenia, co czyni je doskonałym wskaźnikiem tego, jak dobrze radzisz sobie z eksploracją.\n\n(Listę istotnych miejsc i nieużytych kluczy znaleźć możesz w zakładce notatek w okienku dziennika.)
journal.document.adventurers_guide.levelling.title=Zdobywanie doświadczenia
journal.document.adventurers_guide.levelling.body=Zdobywanie poziomów doświadczenia wpływa na statystyki i pozwala uzyskać punkty talentów, które mogą mieć znaczenie w walce. Najlepiej zdobywać co najmniej jeden poziom na każde piętro lochu.\n\nPrzebiegnięcie przez loch i uniknięcie walki lub eksploracji może być kuszące, ale pozbawi cię cennych zasobów i doświadczenia.\n\n(Możesz zobaczyć informacje o swoim bohaterze, w tym o jego doświadczeniu, na panelu statystyk w rogu interfejsu. Wybierz portret swojego bohatera, aby zobaczyć jeszcze więcej informacji.)
journal.document.adventurers_guide.positioning.title=Ustawianie się
journal.document.adventurers_guide.positioning.body=Strategia jest równie ważna co wyposażenie. Możesz uniknąć wiele niekorzystnych sytuacji, takich jak zostanie otoczonym, poprzez zajmowanie odpowiednich pozycji.\n\nDla przykładu, większość lochów ma wąskie korytarze, zmuszające przeciwników do walki w pojedynkę. Korytarze często mają też drzwi przydatne przy atakach z zaskoczenia!\n\nInne elementy otoczenia takie jak trawa, woda, przepaść czy pułapki też możesz wykorzystywać w pewnym stopniu na twoją korzyść.
journal.document.adventurers_guide.magic.title=Ataki magiczne
journal.document.adventurers_guide.magic.body=Ataki magiczne przenikają przez zbroję i są trudne do uniknięcia. Oznacza to, że obrażenia różdżek są niemal niezawodne, ale czyni to władających magią przeciwników bardzo niebezpiecznymi!\n\nAtaki magiczne zawsze mają jakąś wadę. Różdżki mają ograniczoną liczbę ładunków, a magiczni przeciwnicy zazwyczaj nie będą mogli używać swojej magii w zwarciu.\n\nPodczas starcia z wrogami, którzy używają magii, ważne jest nauczenie się, jak uniemożliwić im używanie jej przeciwko tobie.

journal.document.alchemy_guide.title=Poradnik alchemiczny
journal.document.alchemy_guide.potions.title=Wstęp i mikstury
journal.document.alchemy_guide.potions.body=Witaj w "Praktycznych zastosowaniach alchemii"! Ta książka jest zbiorem przepisów na przedmioty wytwarzane przez alchemię.\n\nZacznijmy od najbardziej znanego przepisu: Mikstury!\n\nUżyj trzech nasion, aby uwarzyć losową miksturę! Każde nasienie ma odpowiednik w miksturze. Użyj kilku identycznych nasion w celu zwiększenia szansy na uzyskanie odpowiadającej mu mikstury.
journal.document.alchemy_guide.stones.title=Tworzenie kamieni runicznych
journal.document.alchemy_guide.stones.body=Wrzucenie zwoju do tygla alchemicznego sprawi, że dwa kamienie wchłoną jego magię. W ten sposób można zidentyfikować zwój i otrzymać kamienie runiczne!
journal.document.alchemy_guide.energy_food.title=Energia i jedzenie
journal.document.alchemy_guide.energy_food.body=Wiele receptur wymaga skrystalizowanej energii alchemicznej, wytwarzanej poprzez rozkładanie przedmiotów jednorazowego użytku w tyglu alchemicznym. Przekształcanie zwojów i mikstur w energię pozwala je zidentyfikować.\n\nCzęść receptur wymagających energii to czysta magia, aczkolwiek tym bliżej jest do tradycjonalnej kuchni.
journal.document.alchemy_guide.exotic_potions.title=Egzotyczne eliksiry
journal.document.alchemy_guide.exotic_potions.body=Połącz mikstury z energią, aby tworzyć egzotyczne eliksiry. Są one potężniejsze od zwykłych, choć czasami mają nieco inne działanie.
journal.document.alchemy_guide.exotic_scrolls.title=Egzotyczne zwoje
journal.document.alchemy_guide.exotic_scrolls.body=Używając zwoju i szczypty energii alchemicznej możesz tworzyć egzotyczne zwoje. Są one trochę silniejsze od egzotycznych eliksirów, ale też od nich droższe.
journal.document.alchemy_guide.bombs.title=Zaawansowane bomby
journal.document.alchemy_guide.bombs.body=Zwykła czarnoprochowa bomba może być napełniona specyficznymi przedmiotami, aby polepszyć jej właściwości. Dzięki inżynierowie!
journal.document.alchemy_guide.weapons.title=Wzmacnianie broni
journal.document.alchemy_guide.weapons.body=Niektóre lżejsze lub bardziej przepełnione magią bronie mogą być użyte w alchemii!\n\nZ zestawu broni miotanej powstaje dość płynnego metalu, by w pełni naprawić inny zestaw o tym samym poziomie i kręgu. Wykorzystanie zestawu broni w alchemii zniszczy go całego, nawet jeśli nie masz go w całości przy sobie!\n\nZ różdżki powstaje dość magicznej żywicy, by móc ulepszyć dwie różdżki na tym samym poziomie, ale nie wyżej niż do poziomu +3.
journal.document.alchemy_guide.brews_elixirs.title=Mieszaniny i Eliksiry
journal.document.alchemy_guide.brews_elixirs.body=Mieszaniny i eliksiry są skomplikowanymi miksturami, które zazwyczaj są jednorazowe, ale zapewniają najróżniejsze efekty.
journal.document.alchemy_guide.spells.title=Zaklęcia
journal.document.alchemy_guide.spells.body=Zaklęcia są zamknięte w kryształach, które zazwyczaj mają wiele użyć. Oferują one całą gamę efektów.

